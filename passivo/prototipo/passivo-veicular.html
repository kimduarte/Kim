*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--fundo);color:var(--texto);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}

p{margin:0}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.suave{color:var(--suave)}

.proto{background:var(--aviso-bg);color:var(--aviso);border-bottom:1px solid var(--borda);padding:7px 16px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12.5px}
.proto b{font-weight:700}
.proto .ver{margin-left:auto;display:flex;gap:6px;align-items:center}
.proto select{padding:3px 6px;border-radius:5px;border:1px solid var(--borda);background:var(--sup);color:var(--texto);font-size:12.5px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 34px)}
.lat{background:var(--lateral);color:var(--lateral-texto);padding:20px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:calc(100vh - 34px);height:calc(100dvh - 34px);min-width:0}
.marca{padding:0 8px;display:grid;gap:2px}

nav.menu{display:grid;gap:2px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;border:0;background:none;color:inherit;cursor:pointer;text-align:left;font-weight:500;width:100%}

.item .cont{margin-left:auto;font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.8}

main{padding:26px 28px 60px;display:grid;gap:20px;align-content:start;min-width:0}
.cab{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.cab h1{font-size:24px;font-weight:800}
.cab p{color:var(--suave);margin-top:2px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;border:1px solid var(--borda);background:var(--sup);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--azul)}
.btn.pri{background:var(--azul);border-color:var(--azul);color:var(--sobre-azul)}

.btn.perigo{color:var(--erro);border-color:var(--erro)}

.cartao{background:var(--sup);border:1px solid var(--borda);border-radius:10px}

.kpi{background:var(--sup);padding:16px 18px;display:grid;gap:3px}

.grade2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}

.atencao{display:grid;gap:0}

.esf-num{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--borda);border:1px solid var(--borda);border-radius:8px;overflow:hidden}

.esf-num span{font-size:12.5px;color:var(--suave)}
.pag-cartao{padding:14px 16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;border-color:var(--ok)}
.pag-cartao>div{display:grid;gap:6px;min-width:0}
.anexos{display:flex;flex-wrap:wrap;gap:6px}

.per-cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.escolha{display:grid;gap:6px;max-height:220px;overflow-y:auto}
.escolha .btn{justify-content:flex-start;white-space:normal;text-align:left;font-weight:500}
.h3p{font-size:13px;font-weight:700;margin-bottom:8px}

.status-grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.ferr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.tabela{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--borda);vertical-align:middle}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);font-weight:700;background:var(--sup2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clic{cursor:pointer}

td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rodape-tab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--borda);color:var(--suave);font-size:12.5px}
.vazio{padding:40px 16px;text-align:center;color:var(--suave)}

.placa{display:inline-grid;grid-template-rows:5px auto;border:1.5px solid var(--placa-borda);border-radius:4px;background:var(--placa-bg);overflow:hidden;min-width:80px;text-align:center;vertical-align:middle}
.placa::before{content:"";background:#1f4fa8}
.placa span{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.06em;color:#111;padding:1px 6px 0}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
.p-azul{background:var(--azul-claro);color:var(--azul-escuro)}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-aviso{background:var(--aviso-bg);color:var(--aviso)}
.p-erro{background:var(--erro-bg);color:var(--erro)}
.p-roxo{background:var(--roxo-bg);color:var(--roxo)}

.sub{display:block;color:var(--suave);font-size:12px}

.fundo-modal{position:fixed;inset:0;background:rgba(10,18,35,.45);display:grid;place-items:start center;padding:6vh 16px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--sup);border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);width:100%;max-width:640px;display:grid}
.modal.largo{max-width:900px}
.modal-cab{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--borda)}

.doc{background:#fff;color:#111;border:1px solid var(--borda);border-radius:6px;padding:28px 26px;font-family:Arial,Helvetica,sans-serif;font-size:12px;display:grid;gap:4px;overflow-x:auto}

.doc th{background:#eef1f6;color:#111;letter-spacing:0;text-transform:none;font-size:11px}
.doc .data{margin-top:14px;text-align:right}

.bloqueio{max-width:480px;margin:10vh auto;padding:28px;display:grid;gap:12px;text-align:center}
.bloqueio .cad{font-size:40px}
.bloqueio .email{font-family:var(--mono);background:var(--sup2);border:1px solid var(--borda);border-radius:6px;padding:8px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13.5px;z-index:40;box-shadow:var(--sombra)}
.sel-lista{display:grid;max-height:320px;overflow-y:auto;border:1px solid var(--borda);border-radius:8px}

.sel-lista label:first-child{border-top:0}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lat{position:static;height:auto;padding:12px 12px 8px;gap:10px}
  nav.menu{display:flex;overflow-x:auto;gap:4px}
  .item{width:auto;white-space:nowrap}
  .item .cont,.item .novo{margin-left:4px}
  .quem{display:none}
  main{padding:18px 16px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grade2,.grade3{grid-template-columns:1fr}
}
@media (max-width:560px){.form,.dados{grid-template-columns:1fr}.status-grade{grid-template-columns:repeat(2,minmax(0,1fr))}}

const placa=p=>`<span class="placa"><span>${esc(p)}</span></span>`;
const veic=p=>S.V.find(v=>v.p===p&&!v.exc);
function sitPill(s){if(!s)return '<span class="pill p-neutro">—</span>';if(s.includes('TRANSF'))return '<span class="pill p-ok">Transferido</span>';if(s.includes('COMUNICADO'))return '<span class="pill p-azul">Comunicado de venda</span>';return '<span class="pill p-aviso">Em circulação</span>'}
function stPill(s){const m={Pendente:'p-aviso',Enviado:'p-azul',Recebido:'p-roxo',Cancelada:'p-ok',Baixado:'p-ok',Negada:'p-erro',Paga:'p-ok',Pago:'p-ok','Pago na transferência':'p-ok'};return `<span class="pill ${m[s]||'p-neutro'}">${esc(s)}</span>`}
function tipoPill(t){const m={'Infração':'p-erro','IPVA':'p-roxo','Licenciamento':'p-azul','Taxas':'p-neutro','Outra':'p-neutro'};return `<span class="pill ${m[t]}">${esc(t)}</span>`}
function ref(d){if(d.t==='Infração')return `<span class="mono">${esc(d.ait)}</span><span class="sub">cód. ${esc(d.cod||'—')} · art. ${esc(d.art||'—')}</span>`;return d.ex?`Exercício ${esc(d.ex)}`:'<span class="suave">exercício não informado</span>'}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function debitosAbertos(p){return S.D.filter(d=>d.p===p&&ABERTO(d.st))}
const soma=a=>a.reduce((s,d)=>s+(d.v||0),0);
const pagosTransf=p=>S.D.filter(d=>d.p===p&&d.pt);

const dataBR=iso=>{if(!iso)return '';const [a,m,d]=iso.split('-');return `${d}/${m}/${a}`};

const anexosHTML=(cs,rm)=>cs.map((c,i)=>`<span class="anexo">📎 ${esc(c.nome)} <small>${esc(c.tam)}</small>${rm?`<button type="button" class="fechar" data-rmc="${i}" aria-label="Remover ${esc(c.nome)}">×</button>`:''}</span>`).join('');
function camposPag(v){const g=v.pag||{data:'',comps:[],sei:'',obs:''};

  $('#pgf').onchange=e=>{[...e.target.files].forEach(f=>comps.push({nome:f.name,tam:f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1024))+' KB'}));e.target.value='';pinta()};

function barras(itens,cor){if(!itens.length)return '<p class="suave" style="font-size:13px">Nada registrado ainda.</p>';const max=Math.max(...itens.map(x=>x[1]),1);return `<div class="barras">${itens.map(([n,v,s])=>`<div class="barra"><span>${esc(n)} <small>${esc(s||'')}</small></span><span class="v">${brl(v)}</span><div class="tr"><i style="width:${Math.max(v/max*100,.8)}%;background:${cor||'var(--azul)'}"></i></div></div>`).join('')}</div>`}
function painel(){
  const ativos=S.V.filter(v=>!v.exc);
  const ab=S.D.filter(d=>ABERTO(d.st)&&veic(d.p));
  const pt=S.D.filter(d=>d.pt&&veic(d.p));
  const vPt=[...new Set(pt.map(d=>d.p))];
  const transfT=ativos.filter(v=>v.sit.includes('TRANSF'));
  const comDeb=new Set(ab.map(d=>d.p)).size;
  const porV=vPt.map(p=>soma(pt.filter(d=>d.p===p)));
  const semReg=ativos.filter(semRegistro);
  const comData=ativos.filter(v=>v.pag&&v.pag.data&&pagosTransf(v.p).length);
  const per={};comData.forEach(v=>{const [a,m]=v.pag.data.split('-');const k=S.per==='ano'?a:`${a}-${m}`;per[k]=(per[k]||0)+soma(pagosTransf(v.p))});
  const perL=Object.keys(per).sort().map(k=>[S.per==='ano'?k:`${MESES[+k.slice(5)-1]}/${k.slice(0,4)}`,per[k],'']);
  const instPt={};pt.forEach(d=>{const k=veic(d.p).inst||'Sem instituição';instPt[k]=(instPt[k]||0)+(d.v||0)});
  const porTipo=['IPVA','Licenciamento','Infração','Taxas','Outra'].map(t=>[t==='Infração'?'Multas':t,soma(ab.filter(d=>d.t===t)),ab.filter(d=>d.t===t).length+' débitos']).filter(x=>x[1]>0);
  const inst={};ab.forEach(d=>{const k=veic(d.p).inst||'Sem instituição';inst[k]=(inst[k]||0)+(d.v||0)});
  const rank=Object.entries(inst).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const inf=S.D.filter(d=>d.t==='Infração');
  const semValor=S.D.filter(d=>d.v==null&&ABERTO(d.st));
  const semVeic=S.D.filter(d=>!veic(d.p));
  const aguard=S.O.filter(o=>o.st==='Aguardando resposta');
  return `<div class="cab"><div><h1>Painel geral</h1><p>${ativos.length} veículos no passivo${ativos.length?` · ${new Set(ativos.map(v=>v.uf)).size} UF`:''}</p></div>
   <div class="acoes"><button class="btn" id="rel">Gerar relatório de pendências</button></div></div>
  <div class="kpis">
   <div class="kpi"><b>${ativos.length}</b><span>veículos no passivo</span></div>
   <div class="kpi"><b>${transfT.length}</b><span>já transferidos · ${vPt.length} com custo</span></div>
   <div class="kpi"><b>${brl(soma(ab))}</b><span>em aberto em ${comDeb} veículos${semValor.length?` · ${semValor.length} sem valor`:''}</span></div>
   <div class="kpi"><b style="color:var(--ok)">${brl(soma(pt))}</b><span>pagos para regularizar</span></div>
  </div>
  <div class="cartao painel esforco"><div class="esf-cab"><div><h2>Esforço de regularização</h2><p class="suave" style="font-size:13px">O que foi pago para a transferência dos veículos sair. Em veículo transferido, todo débito lançado conta como pago.</p></div><button class="btn min" data-ir-f="pagos">Ver os ${vPt.length} veículos</button></div>
   <div class="esf-num">
    <div><b>${brl(soma(pt))}</b><span>pago no total</span></div>
    <div><b>${vPt.length} <small>de ${transfT.length}</small></b><span>transferências com custo; ${transfT.length-vPt.length} saíram sem custo</span></div>
    <div><b>${brl(vPt.length?soma(pt)/vPt.length:0)}</b><span>média por veículo com custo</span></div>
    <div><b>${brl(porV.length?Math.max(...porV):0)}</b><span>maior valor num só veículo</span></div>
   </div>
   <div class="grade2">
    <div><h3 class="h3p">Pago por tipo</h3>${barras(['IPVA','Licenciamento','Infração','Taxas','Outra'].map(t=>[t==='Infração'?'Multas':t,soma(pt.filter(d=>d.t===t))]).filter(x=>x[1]>0),'var(--ok)')}</div>

   </div>
   <div class="per"><div class="per-cab"><h3 class="h3p" style="margin:0">Pago ao longo do tempo</h3><span class="suave" style="font-size:12.5px">${comData.length} de ${vPt.length} com data registrada</span>
    <div class="ferr" style="margin-left:auto"><button class="chip" data-per="mes" aria-pressed="${S.per!=='ano'}">Por mês</button><button class="chip" data-per="ano" aria-pressed="${S.per==='ano'}">Por ano</button></div></div>
    ${perL.length?barras(perL,'var(--ok)'):`<p class="suave vazio-per">Nenhum pagamento com data registrada ainda. Ao registrar a data e o comprovante na ficha de cada veículo, este gráfico se monta sozinho.</p>`}
    ${perL.length&&comData.length<vPt.length?`<p class="suave" style="font-size:12.5px">${brl(soma(pt)-perL.reduce((s,x)=>s+x[1],0))} pagos ainda sem data não aparecem aqui.</p>`:''}</div>
   </div>
  <div class="grade3">

     <button data-ir-f="semreg"><span class="pill p-aviso">${semReg.length}</span><span><span class="t">Pagamentos sem data ou comprovante</span><small>Transferências pagas que ainda não têm a guia registrada.</small></span><span aria-hidden="true">›</span></button>

     <button data-ir-f="semveic"><span class="pill p-aviso">${semVeic.length}</span><span><span class="t">Débitos de veículo não cadastrado</span><small>A placa não está na lista do passivo.</small></span><span aria-hidden="true">›</span></button>

  </div>
  <div class="grade2">

  </div>`;
}

/* ---------- VEÍCULOS ---------- */
function veiculos(){
  const f=S.fV,q=f.q.trim().toUpperCase();
  let l=S.V.filter(v=>!v.exc);
  if(f.sit==='EM CIRCULAÇÃO')l=l.filter(v=>v.sit==='EM CIRCULAÇÃO');else if(f.sit)l=l.filter(v=>v.sit.includes(f.sit));
  if(f.comDeb)l=l.filter(v=>debitosAbertos(v.p).length);
  if(f.comPago)l=l.filter(v=>pagosTransf(v.p).length);
  if(f.semReg)l=l.filter(semRegistro);
  if(q)l=l.filter(v=>[v.p,v.ch,v.mod,v.inst,v.ente,v.doc].join(' ').toUpperCase().includes(q));
  const chips=[['','Todos'],['EM CIRCULAÇÃO','Em circulação'],['COMUNICADO','Comunicado de venda'],['TRANSF','Transferido']];
  return `<div class="cab"><div><h1>Veículos</h1><p>Cadastro dos veículos doados com passivo pendente</p></div>
   <div class="acoes">${pode.escrever()?'<button class="btn pri" id="novo-v">+ Cadastrar veículo</button>':''}</div></div>
  <div class="ferr"><input class="busca" id="bq" type="search" placeholder="Placa, chassi, modelo, instituição…" value="${esc(f.q)}" aria-label="Buscar veículos">

const RX_PLACA=/^[A-Z]{3}\d[A-Z0-9]\d{2}$/;
function formV(v){

   ${campo('fr','RENAVAM',{val:v.ren,mono:true})}${campo('fmod','Marca / modelo',{val:v.mod,ob:true})}${campo('fa','Ano fab./modelo',{val:v.ano,dica:'Ex.: 2023/2024'})}
   ${campo('fs','Situação no DETRAN',{op:SITS,val:v.sit})}${campo('fu','UF',{op:['',...UFS],val:v.uf,ob:true})}${campo('fe','Ente',{val:v.ente,dica:'Estado ou município donatário'})}
   ${campo('fi','Instituição',{val:v.inst})}${campo('fd','Doc. de doação / nº SEI',{val:v.doc,mono:true})}</div>`;
  const lote=`<div class="aviso i"><b>Cole várias linhas de uma vez</b><span>Uma linha por veículo, colunas separadas por tabulação ou ponto e vírgula: placa; chassi; modelo; ano; UF. Dá para copiar direto da planilha.</span></div>
   <div class="campo"><label for="lt">Veículos</label><textarea id="lt" placeholder="ABC1D23;9BWZZZ377VT004251;VW/GOL 1.0;2023/2024;GO"></textarea></div><div id="lt-r"></div>`;
  modal({titulo:ed?`Editar ${esc(v.p)}`:'Cadastrar veículo',largo:true,
   corpo:`${ed?'':'<div class="abas-m" role="tablist"><button role="tab" aria-selected="true" data-m="i">Individual</button><button role="tab" aria-selected="false" data-m="l">Em lote</button></div>'}<div id="mc">${ind}</div>`,
   pe:`<button class="btn" data-fechar>Cancelar</button><button class="btn pri" id="salv">${ed?'Salvar alterações':'Cadastrar'}</button>`,
   aoAbrir(){
     let modo='i';
     document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modo=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-selected',x===b));$('#mc').innerHTML=modo==='i'?ind:lote;$('#salv').textContent=modo==='i'?'Cadastrar':'Conferir linhas';if(modo==='l')$('#lt').oninput=()=>{$('#salv').textContent='Conferir linhas'}});
     $('#salv').onclick=()=>{
       if(modo==='l')return lotePreview();
       const g=id=>$('#'+id).value.trim();
       const p=g('fp').toUpperCase().replace(/[^A-Z0-9]/g,''),ch=g('fch').toUpperCase();
       let ok=true;const err=(id,m)=>{$('#'+id+'-e').textContent=m;$('#'+id).classList.toggle('inv',!!m);if(m)ok=false};
       err('fp',!RX_PLACA.test(p)?'Placa inválida. Use 7 caracteres, como ABC1234 ou ABC1D23.':S.V.some(x=>x.p===p&&!x.exc&&x!==v)?'Já existe um veículo ativo com essa placa.':'');
       err('fch',ch.length!==17?`O chassi tem ${ch.length} caracteres; precisa ter 17.`:S.V.some(x=>x.ch===ch&&!x.exc&&x!==v)?'Já existe um veículo ativo com esse chassi.':'');
       err('fmod',g('fmod')?'':'Informe a marca e o modelo.');
       err('fu',g('fu')?'':'Escolha a UF.');
       if(!ok)return;
       const novo={p,ch,ren:g('fr'),mod:g('fmod').toUpperCase(),ano:g('fa'),sit:g('fs'),uf:g('fu'),ente:g('fe'),inst:g('fi'),doc:g('fd')};
       if(ed){const virou=!v.sit.includes('TRANSF')&&novo.sit.includes('TRANSF');const volt=v.sit.includes('TRANSF')&&!novo.sit.includes('TRANSF');
         if(v.p!==p)S.D.forEach(d=>{if(d.p===v.p)d.p=p});Object.assign(v,novo);
         const ab=debitosAbertos(p);
         if(volt){S.D.forEach(d=>{if(d.p===p&&d.pt){d.pt=false;d.st='Pendente'}});delete v.pag}
         if(virou&&ab.length){fechar();render();modal({titulo:`${esc(p)} foi transferido`,corpo:`<p>Este veículo tem ${ab.length} débito${ab.length>1?'s':''} em aberto, somando <b>${brl(soma(ab))}</b>. Se foram pagos para a transferência sair, registre a data e o comprovante: o valor passa a contar no esforço de regularização.</p>${camposPag(v)}`,
           pe:`<button class="btn" data-fechar>Não foram pagos</button><button class="btn pri" id="ok">Marcar como pagos</button>`,aoAbrir(){const ler=ligaPag(v);$('#ok').onclick=()=>{const r=ler();if(!r)return;v.pag=r;ab.forEach(d=>{d.st=d.t==='Infração'?'Paga':'Pago';d.pt=true});fechar();render();toast(`${brl(soma(ab))} pagos em ${dataBR(r.data)}`)}}});return}
         toast('Alterações salvas')}
       else{S.V.unshift({...novo,id:S.V.length+1,exc:false});toast(`${p} cadastrado`)}
       fechar();render();
     };
     function lotePreview(){
       const linhas=$('#lt').value.split('\n').map(l=>l.trim()).filter(Boolean);
       if($('#salv').dataset.pronto==='1'){const ok=JSON.parse($('#salv').dataset.v);ok.forEach(n=>S.V.unshift({...n,id:S.V.length+1,exc:false,ren:'',sit:SITS[0],ente:'',inst:'',doc:''}));fechar();render();toast(`${ok.length} veículos cadastrados`);return}
       const vistos=new Set(),bons=[],ruins=[];
       linhas.forEach((l,i)=>{const [p0='',ch0='',mod='',ano='',uf0='']=l.split(/\t|;/).map(s=>s.trim());const uf=uf0.toUpperCase();const p=p0.toUpperCase().replace(/[^A-Z0-9]/g,''),ch=ch0.toUpperCase();
         const m=!RX_PLACA.test(p)?'placa inválida':ch.length!==17?'chassi sem 17 caracteres':S.V.some(x=>!x.exc&&(x.p===p||x.ch===ch))?'já cadastrado':vistos.has(p)?'repetido na colagem':!UFS.includes(uf)?'UF ausente ou inválida':'';
         vistos.add(p);if(m)ruins.push(`Linha ${i+1} (${esc(p0||'vazia')}): ${m}`);else bons.push({p,ch,mod:mod.toUpperCase(),ano,uf})});
       $('#lt-r').innerHTML=(bons.length?`<div class="aviso o"><b>${bons.length} prontos para cadastrar</b></div>`:'')+(ruins.length?`<div class="aviso a" style="margin-top:8px"><b>${ruins.length} com problema — ficam de fora</b>${ruins.map(r=>`<span>${r}</span>`).join('')}</div>`:'')+(!linhas.length?'<div class="aviso a">Cole ao menos uma linha.</div>':'');
       if(bons.length){$('#salv').textContent=`Cadastrar ${bons.length}`;$('#salv').dataset.pronto='1';$('#salv').dataset.v=JSON.stringify(bons)}
     }
   }});
}

  if(f.st)l=l.filter(d=>d.st===f.st);
  if(q)l=l.filter(d=>[d.p,d.org,d.ait,d.cod,d.t,d.ex].join(' ').toUpperCase().includes(q));
  const tipos=['','Infração','IPVA','Licenciamento','Taxas','Outra'];

  <div class="cartao"><div class="tabela"><table><thead><tr><th>Placa</th><th>Tipo</th><th>Órgão</th><th>Referência</th><th>Ofício</th><th>Status</th><th class="r">Valor</th></tr></thead><tbody>
  ${l.map(d=>{const v=veic(d.p);const o=S.O.find(o=>o.id===d.of);const sts=d.t==='Infração'?ST_INF:ST_GEN;

    <td>${o?`<button class="btn min" data-of="${o.id}">${esc(o.org)} · ${esc(o.data)}</button>`:'<span class="suave">—</span>'}</td>
    <td>${d.pt?stPill('Pago na transferência'):pode.escrever()?`<select class="sel" data-st="${d.id}" aria-label="Status do débito">${sts.map(s=>`<option ${s===d.st?'selected':''}>${s}</option>`).join('')}</select>`:stPill(d.st)}</td>
    <td class="r">${d.v==null?'<span class="pill p-aviso">sem valor</span>':brl(d.v)}</td></tr>`}).join('')||'<tr><td colspan="7" class="vazio">Nenhum débito com esse filtro.</td></tr>'}
  </tbody></table></div><div class="rodape-tab"><span>${l.length} débitos</span><span>Soma: <b class="num">${brl(soma(l))}</b></span></div></div>`;

         ${campo('dcod','Código da infração',{lista:'lcod',mono:true,ob:true,dica:'Ex.: 745-50. Preenche artigo, descrição e valor.'})}${campo('dart','Artigo (CTB)',{lista:'lart',mono:true,ob:true,dica:'Ex.: 218*I. Preenche código, descrição e valor.'})}

       :`${campo('dorg','Órgão / autoridade',{lista:'lorg',ob:true,val:(()=>{const u=veic($('#dp').value.toUpperCase().replace(/[^A-Z0-9]/g,''))?.uf;return u?(t==='IPVA'?`SEFAZ-${u}`:t==='Licenciamento'?`DETRAN-${u}`:''):''})()})}${campo('dex','Exercício / ano',{dica:'Ex.: 2025'})}
         ${campo('dven','Vencimento',{tipo:'date'})}${campo('dval','Valor (R$)',{ob:true})}${campo('dst','Status',{op:ST_GEN})}`;
       const c=$('#dcod'),a=$('#dart');

         $('#descolha').innerHTML='';msg('dcod','✓ Artigo, descrição e valor preenchidos pela tabela',true);msg('dart','',true);

         if(rs.length===1)return aplica(rs[0]);
         if(auto){limpaAuto();c.value='';msg('dcod','',false)}
         if(rs.length>1){msg('dart',`${rs.length} infrações com este artigo — escolha abaixo:`,false);
           $('#descolha').innerHTML=`<div class="escolha">${rs.map(r=>`<button type="button" class="btn min" data-esc="${r[0]}"><span class="mono">${r[0]}</span> ${esc(r[2])}${r[3]!=null?` · ${brl(r[3])}`:''}</button>`).join('')}</div>`;
           document.querySelectorAll('[data-esc]').forEach(b=>b.onclick=()=>aplica(INF_COD.get(b.dataset.esc)));return}
         $('#descolha').innerHTML='';msg('dart','',false)});
     };
     $('#dt').onchange=troca;troca();
     $('#dsalv').onclick=()=>{
       const g=id=>($('#'+id)?.value||'').trim();const t=g('dt');let ok=true;
       const err=(id,m)=>{const e=$('#'+id+'-e');if(!e)return;e.style.color='';e.textContent=m;$('#'+id).classList.toggle('inv',!!m);if(m)ok=false};
       const p=g('dp').toUpperCase().replace(/[^A-Z0-9]/g,'');
       err('dp',RX_PLACA.test(p)?'':'Placa inválida.');
       if(t==='Infração'){err('dait',g('dait')?'':'Informe o número do auto.');if(S.D.some(d=>d.ait&&d.ait===g('dait').toUpperCase()))err('dait','Esse AIT já está cadastrado.');
         err('dcod',/^\d{3}-\d{2}$/.test(g('dcod'))?'':'O código da infração é obrigatório, no formato 000-00.');
         err('dart',g('dart')?'':'O artigo da infração é obrigatório.')}
       err('dorg',g('dorg')?'':'Informe o órgão.');
       const vs=g('dval');const v=vs?parseFloat(vs.replace(/\./g,'').replace(',','.')):null;
       if(vs&&isNaN(v))err('dval','Valor inválido. Use o formato 1.234,56.');else if(t!=='Infração'&&v==null)err('dval','O valor é obrigatório para este tipo.');else if(t!=='Infração'||vs)err('dval','');
       if(!ok)return;
       const id=proxId(S.D);
       S.D.push({id,p,t,org:g('dorg'),ait:t==='Infração'?g('dait').toUpperCase():undefined,cod:g('dcod')||undefined,art:g('dart')||undefined,desc:g('ddesc')||undefined,ex:g('dex')||undefined,v,st:g('dst')});
       fechar();render();toast(`Débito cadastrado para ${p}`);
     };
   }});
}

/* ---------- OFÍCIOS ---------- */
function oficios(){
  const aguard=S.O.filter(o=>o.st==='Aguardando resposta').length;
  return `<div class="cab"><div><h1>Ofícios</h1><p>Pedidos de cancelamento ou baixa enviados aos órgãos — substituem as abas por órgão das planilhas</p></div>
   <div class="acoes">${pode.escrever()?'<button class="btn pri" id="novo-o">+ Novo ofício</button>':''}</div></div>
  <div class="aviso i"><b>Tela nova, proposta para o site.</b><span>Na planilha, cada remessa era uma aba com a numeração recomeçando em 1. Aqui cada ofício guarda a data, o nº SEI, os débitos que foram nele e a resposta do órgão. ${aguard} aguardando resposta.</span></div>
  <div class="oficios">${S.O.slice().reverse().map(o=>{const it=o.itens.map(i=>S.D.find(d=>d.id===i));return `<button class="oficio" data-of="${o.id}">
   <span class="lin"><span class="org" style="color:var(--texto)">${esc(o.org)}</span><span>${esc(o.data)}</span></span>
   <span class="lin"><span>${it.length} débito${it.length>1?'s':''} · ${it.map(d=>d.p).filter((x,i,a)=>a.indexOf(x)===i).join(', ')}</span></span>
   <span class="lin"><span>${o.st==='Aguardando resposta'?'<span class="pill p-azul">Aguardando resposta</span>':'<span class="pill p-ok">Respondido</span>'}</span><b class="num" style="color:var(--texto)">${brl(soma(it))}</b></span>
   ${o.sei?`<span class="lin mono">SEI ${esc(o.sei)}</span>`:''}</button>`}).join('')}</div>`;
}
function oficiosPos(){
  document.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>verOficio(+b.dataset.of));
  const n=$('#novo-o');n&&(n.onclick=novoOficio);
}
function docOficio(org,itens,data){
  const inf=itens.every(d=>d.t==='Infração');
  return `<div class="doc">${cabecalhoDoc()}<div class="c" style="margin-top:8px">VIATURAS POLICIAIS DO MINISTÉRIO DA JUSTIÇA</div>
   <div class="tit">PLANILHA DE SOLICITAÇÃO DE ${inf?'CANCELAMENTO/PRESCRIÇÃO DE INFRAÇÃO':'BAIXA DE DÉBITOS'} ${esc(org.toUpperCase())}</div>
   <table><thead><tr><th>ORD</th><th>PLACA</th><th>RENAVAM</th><th>CHASSI</th><th>MODELO</th><th>ANO</th>${inf?'<th>AIT</th><th>CÓDIGO</th><th>ARTIGO</th>':'<th>DÉBITO</th><th>VALOR</th>'}</tr></thead><tbody>
   ${itens.map((d,i)=>{const v=S.V.find(x=>x.p===d.p)||{};return `<tr><td>${i+1}</td><td>${esc(d.p)}</td><td>${esc(v.ren||'')}</td><td>${esc(v.ch||'')}</td><td>${esc(v.mod||'')}</td><td>${esc(v.ano||'')}</td>${inf?`<td>${esc(d.ait)}</td><td>${esc(d.cod||'')}</td><td>${esc(d.art||'')}</td>`:`<td>${esc(d.t)}${d.ex?' '+esc(d.ex):''}</td><td style="text-align:right">${d.v!=null?d.v.toLocaleString('pt-BR',{minimumFractionDigits:2}):''}</td>`}</tr>`}).join('')}
   </tbody></table><div class="data">Brasília-DF, ${esc(data)}.</div></div>`;
}
function verOficio(id){
  const o=S.O.find(x=>x.id===id),it=o.itens.map(i=>S.D.find(d=>d.id===i));
  const [m,a]=o.data.split('/');const mesExt=Object.fromEntries(['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'].map((x,i)=>[x,MES_EXT[i]]));
  modal({titulo:`Ofício · ${esc(o.org)}`,sub:`${esc(o.data)} · ${it.length} débito${it.length>1?'s':''}`,largo:true,
   corpo:`<div class="abas-m" role="tablist"><button role="tab" aria-selected="true" data-oa="r">Resposta</button><button role="tab" aria-selected="false" data-oa="d">Planilha do ofício</button></div><div id="oc"></div>`,
   pe:`<button class="btn" data-fechar>Fechar</button>${pode.escrever()?'<button class="btn pri" id="osalv">Salvar resposta</button>':''}`,
   aoAbrir(){
     const resp=()=>`<div class="form">${campo('osei','Nº SEI do ofício',{val:o.sei,mono:true,dica:'Não constava na planilha.'})}${campo('ost','Situação',{op:['Aguardando resposta','Respondido'],val:o.st})}</div>
      <div class="cartao"><div class="tabela"><table><thead><tr><th>Placa</th><th>Referência</th><th class="r">Valor</th><th>Resultado</th></tr></thead><tbody>
      ${it.map(d=>{const sts=d.t==='Infração'?ST_INF:ST_GEN;return `<tr><td>${placa(d.p)}</td><td>${ref(d)}</td><td class="r">${d.v==null?'<span class="pill p-aviso">sem valor</span>':brl(d.v)}</td><td>${pode.escrever()?`<select class="sel" data-ost="${d.id}" aria-label="Resultado">${sts.map(s=>`<option ${s===d.st?'selected':''}>${s}</option>`).join('')}</select>`:stPill(d.st)}</td></tr>`}).join('')}
      </tbody></table></div></div>`;
     const pinta=k=>{$('#oc').innerHTML=k==='r'?resp():docOficio(o.org,it,`${mesExt[m]||m} de ${a}`)+'<p class="suave" style="font-size:12.5px">No site real, este documento é baixado em Excel ou PDF para anexar ao SEI.</p>'};
     document.querySelectorAll('[data-oa]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-oa]').forEach(x=>x.setAttribute('aria-selected',x===b));pinta(b.dataset.oa)});
     pinta('r');
     const s=$('#osalv');s&&(s.onclick=()=>{if($('#osei')){o.sei=$('#osei').value.trim();o.st=$('#ost').value;document.querySelectorAll('[data-ost]').forEach(x=>{S.D.find(d=>d.id===+x.dataset.ost).st=x.value})}fechar();render();toast('Resposta do ofício salva')});
   }});
}
function novoOficio(){
  const pend=S.D.filter(d=>d.st==='Pendente');
  const orgs=[...new Set(pend.map(d=>d.org))].sort();
  if(!orgs.length){modal({titulo:'Novo ofício',corpo:'<p>Não há débitos pendentes para pedir. Cadastre um débito ou mude o status de algum para “Pendente”.</p>',pe:'<button class="btn" data-fechar>Fechar</button>'});return}
  modal({titulo:'Novo ofício',sub:'Escolha o órgão e marque os débitos pendentes que vão no pedido.',largo:true,
   corpo:`<div class="form">${campo('oorg','Órgão destinatário',{op:orgs})}${campo('osei2','Nº SEI',{mono:true,dica:'Pode preencher depois.'})}</div><div id="olista"></div>`,
   pe:`<button class="btn" data-fechar>Cancelar</button><button class="btn" id="oprev">Ver planilha</button><button class="btn pri" id="ocriar">Registrar envio</button>`,
   aoAbrir(){
     const lista=()=>{const org=$('#oorg').value;const it=pend.filter(d=>d.org===org);
       $('#olista').innerHTML=`<div class="ferr" style="justify-content:space-between"><b>${it.length} pendente${it.length>1?'s':''} para ${esc(org)}</b><button class="btn min" id="otodos">Marcar todos</button></div>
       <div class="sel-lista">${it.map(d=>`<label><input type="checkbox" value="${d.id}" checked>${placa(d.p)}<span>${tipoPill(d.t)} <span class="suave">${d.t==='Infração'?esc(d.ait):esc(veic(d.p)?.inst||veic(d.p)?.ente||'')}</span></span><b class="num">${brl(d.v)}</b></label>`).join('')}</div>`;
       $('#otodos').onclick=()=>document.querySelectorAll('#olista input').forEach(c=>c.checked=true)};
     $('#oorg').onchange=lista;lista();
     const marcados=()=>[...document.querySelectorAll('#olista input:checked')].map(c=>S.D.find(d=>d.id===+c.value));
     $('#oprev').onclick=()=>{const it=marcados();if(!it.length)return toast('Marque ao menos um débito');const org=$('#oorg').value;
       $('#olista').insertAdjacentHTML('beforeend','<div id="oprevdoc" style="margin-top:12px"></div>');$('#oprevdoc').innerHTML=docOficio(org,it,dataExt().replace(/^\d+ de /,''))};
     $('#ocriar').onclick=()=>{const it=marcados();if(!it.length)return toast('Marque ao menos um débito');const id=proxId(S.O);
       S.O.push({id,org:$('#oorg').value,data:mesAtual(),itens:it.map(d=>d.id),st:'Aguardando resposta',sei:$('#osei2').value.trim()});
       it.forEach(d=>{d.st='Enviado';d.of=id});fechar();S.view='oficios';render();toast(`Ofício registrado com ${it.length} débitos`)};
   }});
}

/* ---------- LIXEIRA ---------- */
function lixeira(){
  const l=S.V.filter(v=>v.exc);
  return `<div class="cab"><div><h1>Lixeira</h1><p>Veículos excluídos. Nada é apagado de verdade — dá para restaurar.</p></div></div>
  <div class="cartao"><div class="tabela"><table><thead><tr><th>Placa</th><th>Modelo</th><th>Excluído por</th><th>Quando</th><th></th></tr></thead><tbody>
  ${l.map(v=>`<tr><td>${placa(v.p)}</td><td>${esc(v.mod)}</td><td>${esc(v.excPor)}</td><td class="num">${esc(v.excEm)}</td><td class="r"><button class="btn min" data-rest="${v.id}">Restaurar</button></td></tr>`).join('')||'<tr><td colspan="5" class="vazio">A lixeira está vazia. Para testar, abra um veículo e use “Mover para a lixeira”.</td></tr>'}
  </tbody></table></div></div>`;
}
function lixeiraPos(){document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{const v=S.V.find(x=>x.id===+b.dataset.rest);if(S.V.some(x=>!x.exc&&(x.p===v.p||x.ch===v.ch)))return toast(`Já existe um veículo ativo com a placa ou o chassi de ${v.p}`);v.exc=false;render();toast(`${v.p} restaurado`)})}

/* ---------- USUÁRIOS ---------- */
function usuarios(){
  return `<div class="cab"><div><h1>Usuários</h1><p>Quem pode entrar e o que pode fazer. O login é pela Conta do Google.</p></div></div>
  <div class="grade3">
  <div class="cartao"><div class="tabela"><table><thead><tr><th>E-mail</th><th>Perfil</th><th></th></tr></thead><tbody>
  ${S.U.map((u,i)=>`<tr><td class="mono" style="overflow-wrap:anywhere">${esc(u.email)}${u.email===EU?' <span class="pill p-neutro">você</span>':''}</td><td>${u.email===EU?'<span class="pill p-azul">Admin</span>':`<select class="sel" data-up="${i}" aria-label="Perfil"><option value="admin" ${u.perfil==='admin'?'selected':''}>Admin</option><option value="usuario" ${u.perfil==='usuario'?'selected':''}>Usuário</option><option value="visitante" ${u.perfil==='visitante'?'selected':''}>Visitante</option></select>`}</td><td class="r">${u.email===EU?'':`<button class="btn min perigo" data-ur="${i}">Remover</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="cartao painel"><h2>Cadastrar pessoa</h2>
   <div class="form" style="grid-template-columns:1fr">${campo('ue','E-mail do Google',{tipo:'email',ob:true})}${campo('upf','Perfil',{op:['Usuário','Admin','Visitante']})}</div>
   <button class="btn pri" id="uadd">Cadastrar</button>
   <dl style="display:grid;gap:8px;font-size:12.5px" class="suave">
    <div><b style="color:var(--texto)">Admin</b> — tudo, inclusive excluir, lixeira e esta tela.</div>
    <div><b style="color:var(--texto)">Usuário</b> — cadastra e edita; não exclui.</div>
    <div><b style="color:var(--texto)">Visitante</b> — só consulta.</div></dl></div></div>`;
}
function usuariosPos(){
  document.querySelectorAll('[data-up]').forEach(s=>s.onchange=()=>{S.U[+s.dataset.up].perfil=s.value;toast('Perfil alterado')});
  document.querySelectorAll('[data-ur]').forEach(b=>b.onclick=()=>{const u=S.U[+b.dataset.ur];confirmar(`Remover ${esc(u.email)}?`,'A pessoa perde o acesso na hora. Os registros que ela fez continuam.','Remover acesso',()=>{S.U.splice(+b.dataset.ur,1);render();toast('Acesso removido')})});
  $('#uadd').onclick=()=>{const e=$('#ue').value.trim().toLowerCase();const er=$('#ue-e');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){er.textContent='E-mail inválido.';return}
    if(S.U.some(u=>u.email===e)){er.textContent='Esse e-mail já está cadastrado.';return}
    S.U.push({email:e,perfil:{'Usuário':'usuario','Admin':'admin','Visitante':'visitante'}[$('#upf').value]});render();toast(`${e} cadastrado`)};
}

const TELAS={painel,veiculos,debitos,oficios,lixeira,usuarios};
const TELAS_POS={painel:painelPos,veiculos:veiculosPos,debitos:debitosPos,oficios:oficiosPos,lixeira:lixeiraPos,usuarios:usuariosPos};
render();
</script>
