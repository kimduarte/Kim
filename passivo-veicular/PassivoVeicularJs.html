<!--
  PassivoVeicularJs.html
  JavaScript específico do Passivo Veicular (client-side) — cadastro,
  listagem, painel geral, infrações, lixeira, impressão/exportação. Copiado
  de PassivoVeicularJs.html sem alterações de lógica; depende das funções
  genéricas de UtilitariosCliente.html e das globais CONTEXTO/
  USUARIO_E_ADMIN/USUARIO_PODE_EDITAR/ORGAOS_POR_UF (definidas lá e
  preenchidas no bootstrap de Pagina.html).
-->
<script>
  // ---------- Painel Passivo Veicular ----------
  var PV_INICIALIZADO = false;
  var PV_LISTAS = null;
  var PV_MODO_CADASTRO = 'individual';
  var PV_CACHE_LISTAGEM = {};
  var PV_SELO_SITUACAO = { 'PENDENTE': 'selo-nao', 'EM ANDAMENTO': 'selo-pendente', 'CONCLUÍDA': 'selo-sim' };

  var PV_LISTAS_DEBITOS = null;
  var PV_CACHE_INFRACOES = {};
  var PV_SELO_STATUS_INFRACAO = { 'PENDENTE': 'selo-pendente', 'ENVIADO': 'selo-nao', 'RECEBIDO': 'selo-azul', 'CANCELADA': 'selo-sim', 'NEGADA': 'selo-vermelho', 'PAGO': 'selo-sim' };
  var PV_ORGAO_MUNICIPAL_VALOR = '__outro__';
  var PV_MAPA_ARTIGOS = {};

  function pvInicializar_() {
    if (PV_INICIALIZADO) return;
    PV_INICIALIZADO = true;
    var nomeUsuarioPv = (CONTEXTO && CONTEXTO.usuario) ? (CONTEXTO.usuario.nome || CONTEXTO.usuario.email) : '';
    document.getElementById('pvInfoUsuarioNome').textContent = nomeUsuarioPv;
    var rotulosPerfil = { admin: 'Administrador', usuario: 'Usuário', visitante: 'Visitante', sem_acesso: 'Sem acesso' };
    document.getElementById('pvInfoUsuarioPerfil').textContent =
      (CONTEXTO && CONTEXTO.usuario) ? 'Perfil: ' + (rotulosPerfil[CONTEXTO.usuario.perfil] || CONTEXTO.usuario.perfil) : '';
    document.getElementById('pvSaudacao').textContent = 'Bem-vindo, ' + nomeUsuarioPv;
    var dataPvExtenso = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    document.getElementById('pvData').textContent = dataPvExtenso.charAt(0).toUpperCase() + dataPvExtenso.slice(1);
    document.getElementById('navPvCadastro').style.display = USUARIO_PODE_EDITAR ? '' : 'none';
    pvConfigurarFormularios_();
    pvConfigurarModalInfracao_();
    pvConfigurarModalUsuario_();
    chamarServidor_('getListasPassivo').then(function (listas) {
      PV_LISTAS = listas;
      pvPreencherListasFormularios_();
      pvAlternarModoCadastro_('individual');
      carregarPainelPv_();
    }).catch(mostrarErroGlobalPv_);
    chamarServidor_('getListasDebitosPassivo').then(function (listas) {
      PV_LISTAS_DEBITOS = listas;
      pvPreencherListasInfracoes_();
    }).catch(mostrarErroGlobalPv_);
  }

  function mostrarErroGlobalPv_(erro) {
    var div = document.getElementById('mensagemGlobalPv');
    div.innerHTML = '<div class="mensagem erro">' + escaparHtml(erro.message || String(erro)) + '</div>';
  }

  function pvPreencherListasFormularios_() {
    preencherSelect('pv_UF', PV_LISTAS.uf, true);
    preencherSelect('pve_UF', PV_LISTAS.uf, true);
    preencherSelect('pvPainelUF', PV_LISTAS.uf, false, 'Todas');
    preencherSelect('pvfUF', PV_LISTAS.uf, false, 'Todas');
    preencherSelect('pv_SituacaoTransferencia', PV_LISTAS.situacoes, false);
    preencherSelect('pve_SituacaoTransferencia', PV_LISTAS.situacoes, false);
    preencherSelect('pvfSituacao', PV_LISTAS.situacoes, false, 'Todas');
    preencherSelect('pvu_UF', PV_LISTAS.uf, false, '—');
  }

  function pvAtualizarSelectInstituicoes_(lista) {
    var ordenada = lista.filter(function (x) { return x; }).sort();
    ['pvPainelInstituicao', 'pvfInstituicao'].forEach(function (id) {
      var sel = document.getElementById(id);
      var atual = sel.value;
      sel.innerHTML = '<option value="">Todas</option>' + ordenada.map(function (i) {
        return '<option value="' + escaparHtml(i) + '">' + escaparHtml(i) + '</option>';
      }).join('');
      sel.value = atual;
    });
  }

  // ---------- Navegação entre telas do Passivo ----------
  function irParaTelaPv_(nome) {
    document.querySelectorAll('.tela-pv').forEach(function (t) { t.classList.remove('ativa'); });
    document.getElementById('tela-' + nome).classList.add('ativa');
    document.querySelectorAll('.app-nav-item[data-tela-pv]').forEach(function (el) {
      el.classList.toggle('ativo', el.dataset.telaPv === nome);
    });
    if (nome === 'pv-inicio') carregarPainelPv_();
    if (nome === 'pv-listagem') carregarListagemPv_();
    if (nome === 'pv-infracoes') carregarInfracoesPv_();
    if (nome === 'pv-lixeira') irParaTelaLixeiraPv_();
    if (nome === 'pv-usuarios') irParaTelaUsuariosPv_();
    window.scrollTo(0, 0);
  }

  // ---------- Lixeira ----------
  var PV_LIXEIRA_ITENS_ATUAL = [];

  function irParaTelaLixeiraPv_() {
    if (!USUARIO_E_ADMIN) {
      document.getElementById('pvLixeiraSemPermissao').style.display = '';
      document.getElementById('pvLixeiraConteudo').style.display = 'none';
      return;
    }
    document.getElementById('pvLixeiraSemPermissao').style.display = 'none';
    document.getElementById('pvLixeiraConteudo').style.display = '';
    carregarLixeiraPv_();
  }

  async function carregarLixeiraPv_() {
    var corpo = document.getElementById('corpoTabelaLixeiraPv');
    corpo.innerHTML = '<tr><td colspan="8" class="carregando">Carregando...</td></tr>';
    try {
      PV_LIXEIRA_ITENS_ATUAL = await chamarServidor_('getVeiculosExcluidosPassivo');
      if (!PV_LIXEIRA_ITENS_ATUAL.length) {
        corpo.innerHTML = '<tr><td colspan="8" class="carregando">A lixeira está vazia.</td></tr>';
        return;
      }
      corpo.innerHTML = PV_LIXEIRA_ITENS_ATUAL.map(function (v, i) {
        return '<tr>' +
          '<td>' + escaparHtml(v.Placa) + '</td>' +
          '<td class="mono">' + escaparHtml(v.Chassi) + '</td>' +
          '<td>' + escaparHtml([v.Marca, v.Modelo].filter(Boolean).join(' ')) + '</td>' +
          '<td>' + escaparHtml(v.Instituicao) + '</td>' +
          '<td>' + escaparHtml(v.UF) + '</td>' +
          '<td>' + escaparHtml(v.ExcluidoPor) + '</td>' +
          '<td>' + (v.DataExclusao ? new Date(v.DataExclusao).toLocaleDateString('pt-BR') : '-') + '</td>' +
          '<td><button type="button" class="secundario" onclick="restaurarVeiculoLixeiraPv_(' + i + ')">Restaurar</button></td>' +
          '</tr>';
      }).join('');
    } catch (erro) {
      corpo.innerHTML = '<tr><td colspan="8" class="carregando">Erro: ' + escaparHtml(erro.message || String(erro)) + '</td></tr>';
    }
  }

  async function restaurarVeiculoLixeiraPv_(indice) {
    var v = PV_LIXEIRA_ITENS_ATUAL[indice];
    if (!v) return;
    if (!confirm('Restaurar o veículo ' + v.Placa + ' (' + v.Chassi + ')? Ele volta a aparecer normalmente no Passivo Veicular.')) return;
    try {
      var resp = await chamarServidor_('restaurarVeiculoPassivo', v.ID);
      mostrarMensagem('mensagemGlobalPv', 'sucesso', resp.mensagem);
      carregarLixeiraPv_();
    } catch (erro) {
      mostrarErroGlobalPv_(erro);
    }
  }

  // ---------- Usuários ----------
  var PV_CACHE_USUARIOS = {};
  var PV_ROTULOS_PERFIL = { admin: 'Administrador', usuario: 'Usuário' };

  function irParaTelaUsuariosPv_() {
    if (!USUARIO_E_ADMIN) {
      document.getElementById('pvUsuariosSemPermissao').style.display = '';
      document.getElementById('pvUsuariosConteudo').style.display = 'none';
      return;
    }
    document.getElementById('pvUsuariosSemPermissao').style.display = 'none';
    document.getElementById('pvUsuariosConteudo').style.display = '';
    carregarUsuariosPv_();
  }

  function carregarUsuariosPv_() {
    document.getElementById('pvuCorpoTabela').innerHTML = '<tr><td colspan="5" class="carregando">Carregando...</td></tr>';
    chamarServidor_('getUsuariosPassivo').then(function (lista) {
      PV_CACHE_USUARIOS = {};
      lista.forEach(function (u) { PV_CACHE_USUARIOS[u.Email] = u; });
      document.getElementById('pvuContador').textContent = lista.length;
      pvRenderizarTabelaUsuarios_(lista);
    }).catch(function (erro) {
      document.getElementById('pvuCorpoTabela').innerHTML =
        '<tr><td colspan="5"><div class="mensagem erro">' + escaparHtml(erro.message || String(erro)) + '</div></td></tr>';
    });
  }

  function pvRenderizarTabelaUsuarios_(lista) {
    var corpo = document.getElementById('pvuCorpoTabela');
    if (!lista.length) {
      corpo.innerHTML = '<tr><td colspan="5">Nenhum usuário cadastrado.</td></tr>';
      return;
    }
    corpo.innerHTML = lista.map(function (u) {
      return '<tr class="linha-clicavel" onclick="pvAbrirEdicaoUsuario_(\'' + escaparHtml(u.Email) + '\')">' +
        '<td>' + escaparHtml(u.Email) + '</td>' +
        '<td>' + escaparHtml(u.Nome || '') + '</td>' +
        '<td><span class="selo ' + (u.Perfil === 'admin' ? 'selo-azul' : 'selo-sim') + '">' + escaparHtml(PV_ROTULOS_PERFIL[u.Perfil] || u.Perfil) + '</span></td>' +
        '<td>' + escaparHtml(u.UF || '') + '</td>' +
        '<td><button type="button" class="secundario" onclick="event.stopPropagation(); pvAbrirEdicaoUsuario_(\'' + escaparHtml(u.Email) + '\')">Editar</button></td>' +
        '</tr>';
    }).join('');
  }

  function pvConfigurarModalUsuario_() {
    document.getElementById('formPvUsuario').addEventListener('submit', pvSubmeterUsuario_);
  }

  function pvAbrirNovoUsuario_() {
    document.getElementById('formPvUsuario').reset();
    document.getElementById('pvu_EmailOriginal').value = '';
    document.getElementById('pvuModalTitulo').textContent = 'Novo usuário';
    document.getElementById('pvu_Email').disabled = false;
    document.getElementById('pvuBotaoExcluir').style.display = 'none';
    document.getElementById('mensagemPvUsuario').innerHTML = '';
    document.getElementById('modalPvUsuarioFundo').classList.add('ativo');
  }

  function pvAbrirEdicaoUsuario_(email) {
    var u = PV_CACHE_USUARIOS[email];
    if (!u) return;
    document.getElementById('formPvUsuario').reset();
    document.getElementById('pvu_EmailOriginal').value = u.Email;
    document.getElementById('pvuModalTitulo').textContent = 'Editar usuário';
    document.getElementById('pvu_Email').value = u.Email;
    // E-mail não é editável depois de criado — é a chave que identifica o
    // usuário (tanto no login quanto no compartilhamento da planilha).
    // Pra "trocar" o e-mail de alguém, exclui e cadastra de novo.
    document.getElementById('pvu_Email').disabled = true;
    document.getElementById('pvu_Nome').value = u.Nome || '';
    document.getElementById('pvu_Perfil').value = u.Perfil || 'usuario';
    document.getElementById('pvu_UF').value = u.UF || '';
    document.getElementById('pvuBotaoExcluir').style.display = '';
    document.getElementById('mensagemPvUsuario').innerHTML = '';
    document.getElementById('modalPvUsuarioFundo').classList.add('ativo');
  }

  function pvSubmeterUsuario_(e) {
    e.preventDefault();
    var emailOriginal = document.getElementById('pvu_EmailOriginal').value;
    var dados = {
      email: document.getElementById('pvu_Email').value,
      nome: document.getElementById('pvu_Nome').value,
      perfil: document.getElementById('pvu_Perfil').value,
      uf: document.getElementById('pvu_UF').value
    };
    var chamada = emailOriginal
      ? chamarServidor_('atualizarUsuarioPassivo', emailOriginal, dados)
      : chamarServidor_('cadastrarUsuarioPassivo', dados);
    chamada.then(function (resp) {
      document.getElementById('modalPvUsuarioFundo').classList.remove('ativo');
      if (resp && resp.aviso) {
        mostrarMensagem('mensagemGlobalPv', 'aviso', resp.aviso);
      }
      carregarUsuariosPv_();
    }).catch(function (erro) {
      mostrarMensagem('mensagemPvUsuario', 'erro', erro.message || String(erro));
    });
  }

  function pvExcluirUsuarioAtual_() {
    var email = document.getElementById('pvu_EmailOriginal').value;
    confirmar_('Tem certeza que deseja remover o acesso de ' + email + '? Essa ação não pode ser desfeita.', function () {
      chamarServidor_('excluirUsuarioPassivo', email).then(function () {
        document.getElementById('modalPvUsuarioFundo').classList.remove('ativo');
        carregarUsuariosPv_();
      }).catch(function (erro) {
        mostrarMensagem('mensagemPvUsuario', 'erro', erro.message || String(erro));
      });
    });
  }

  // ---------- Painel Geral ----------
  function carregarPainelPv_() {
    mostrarSkeleton_('pvRankUF', 4);
    mostrarSkeleton_('pvRankInstituicao', 4);
    mostrarSkeleton_('pvRankDebitoUF', 4);
    mostrarSkeleton_('pvRankDebitoInstituicao', 4);
    var filtro = { uf: document.getElementById('pvPainelUF').value, instituicao: document.getElementById('pvPainelInstituicao').value };
    chamarServidor_('getPainelPassivo', filtro).then(function (painel) {
      document.getElementById('pvKpiTotal').textContent = painel.total;
      document.getElementById('pvKpiPendente').textContent = painel.porSituacao['PENDENTE'] || 0;
      document.getElementById('pvKpiAndamento').textContent = painel.porSituacao['EM ANDAMENTO'] || 0;
      document.getElementById('pvKpiConcluida').textContent = painel.porSituacao['CONCLUÍDA'] || 0;
      pvRenderizarRank_('pvRankUF', painel.porUF);
      pvRenderizarRank_('pvRankInstituicao', painel.porInstituicao);
      pvAtualizarSelectInstituicoes_(Object.keys(painel.porInstituicao));
    }).catch(mostrarErroGlobalPv_);
    chamarServidor_('getPainelDebitosPassivo', {}).then(function (painel) {
      document.getElementById('pvKpiDebitoPendente').textContent = formatarMoeda_(painel.totalPendente);
      document.getElementById('pvKpiDebitoPago').textContent = formatarMoeda_(painel.totalPago);
      pvRenderizarRank_('pvRankDebitoUF', painel.porUFPendente, formatarMoeda_);
      pvRenderizarRank_('pvRankDebitoInstituicao', painel.porInstituicaoPendente, formatarMoeda_);
    }).catch(mostrarErroGlobalPv_);
  }

  function pvRenderizarRank_(idContainer, dict, formatarValor) {
    var itens = Object.keys(dict).map(function (k) { return { chave: k, total: dict[k] }; })
      .sort(function (a, b) { return b.total - a.total; });
    var container = document.getElementById(idContainer);
    if (!itens.length) {
      container.innerHTML = '<div class="stat-card-vazio">Sem dados.</div>';
      return;
    }
    var max = itens[0].total;
    container.innerHTML = itens.map(function (item) {
      var pct = max ? Math.round((item.total / max) * 100) : 0;
      return '<div class="rank-linha">' +
        '<span class="rank-uf">' + escaparHtml(item.chave) + '</span>' +
        '<div class="rank-trilha"><div class="rank-barra" style="width:' + pct + '%;"></div></div>' +
        '<span class="rank-valor">' + (formatarValor ? formatarValor(item.total) : item.total) + '</span></div>';
    }).join('');
  }

  // ---------- Cadastro (individual / lote) ----------
  function pvConfigurarFormularios_() {
    document.getElementById('pv_UF').addEventListener('change', pvAtualizarModoInstituicao_);
    document.getElementById('pv_InstituicaoSelect').addEventListener('change', function () {
      var opt = this.options[this.selectedIndex];
      var cnpj = opt ? (opt.dataset.cnpj || '') : '';
      document.getElementById('pv_Instituicao').value = this.value;
      document.getElementById('pv_CNPJInstituicao').value = cnpj;
    });
    document.getElementById('formPvCadastro').addEventListener('submit', pvSubmeterCadastro_);
    document.getElementById('formPvEditar').addEventListener('submit', pvSubmeterEdicao_);
  }

  function pvAtualizarModoInstituicao_() {
    var uf = document.getElementById('pv_UF').value;
    var lista = ORGAOS_POR_UF[uf];
    var inputTexto = document.getElementById('pv_Instituicao');
    var select = document.getElementById('pv_InstituicaoSelect');
    if (lista && lista.length) {
      inputTexto.style.display = 'none';
      inputTexto.required = false;
      select.style.display = '';
      select.required = true;
      select.innerHTML = '<option value="">Selecione o órgão...</option>' + lista.map(function (o) {
        return '<option value="' + escaparHtml(o.orgao) + '" data-cnpj="' + escaparHtml(o.cnpj) + '">' + escaparHtml(o.orgao) + '</option>';
      }).join('');
    } else {
      select.style.display = 'none';
      select.required = false;
      inputTexto.style.display = '';
      inputTexto.required = true;
    }
  }

  function pvAlternarModoCadastro_(modo) {
    PV_MODO_CADASTRO = modo;
    document.getElementById('pvBotaoModoIndividual').className = modo === 'individual' ? 'primario' : 'secundario';
    document.getElementById('pvBotaoModoLote').className = modo === 'lote' ? 'primario' : 'secundario';
    document.getElementById('pvBlocoIndividual').style.display = modo === 'individual' ? '' : 'none';
    document.getElementById('pvBlocoLote').style.display = modo === 'lote' ? '' : 'none';
    ['pv_Marca', 'pv_Modelo', 'pv_Placa', 'pv_Chassi', 'pv_Renavam', 'pv_AnoFabricacao'].forEach(function (id) {
      document.getElementById(id).required = (modo === 'individual');
    });
    if (modo === 'lote' && !document.querySelectorAll('#pvListaLinhasLote .pv-linha-lote').length) {
      pvAdicionarLinhaLote_();
    }
  }

  function pvAdicionarLinhaLote_() {
    var situacoes = (PV_LISTAS && PV_LISTAS.situacoes) || PV_SITUACOES_TRANSFERENCIA_PADRAO_;
    var div = document.createElement('div');
    div.className = 'pv-linha-lote card';
    div.style.marginBottom = '10px';
    div.innerHTML =
      '<div class="grid-form">' +
      '<div class="campo"><label>Marca *</label><input type="text" class="pv_l_Marca" required maxlength="60"></div>' +
      '<div class="campo"><label>Modelo *</label><input type="text" class="pv_l_Modelo" required maxlength="120"></div>' +
      '<div class="campo"><label>Placa *</label><input type="text" class="pv_l_Placa" required maxlength="8" style="text-transform:uppercase"></div>' +
      '<div class="campo"><label>Chassi *</label><input type="text" class="pv_l_Chassi" required maxlength="17" style="text-transform:uppercase"></div>' +
      '<div class="campo"><label>Renavam *</label><input type="text" class="pv_l_Renavam" required maxlength="11"></div>' +
      '<div class="campo"><label>Ano de fabricação *</label><input type="number" class="pv_l_AnoFabricacao" required min="1950" max="2100"></div>' +
      '<div class="campo"><label>Ano de modelo <span class="opcional">(opcional)</span></label><input type="number" class="pv_l_AnoModelo" min="1950" max="2100"></div>' +
      '<div class="campo"><label>CNPJ do proprietário no DETRAN <span class="opcional">(opcional)</span></label><input type="text" class="pv_l_CNPJProprietario" maxlength="20"></div>' +
      '<div class="campo span-2"><label>Situação no DETRAN <span class="opcional">(opcional)</span></label><input type="text" class="pv_l_SituacaoDetran" maxlength="200"></div>' +
      '<div class="campo"><label>Situação da transferência *</label><select class="pv_l_SituacaoTransferencia">' +
        situacoes.map(function (s) { return '<option value="' + s + '">' + s + '</option>'; }).join('') +
      '</select></div>' +
      '</div>' +
      '<button type="button" class="secundario" style="margin-top:8px;" onclick="this.closest(\'.pv-linha-lote\').remove()">Remover este veículo</button>';
    document.getElementById('pvListaLinhasLote').appendChild(div);
  }
  var PV_SITUACOES_TRANSFERENCIA_PADRAO_ = ['PENDENTE', 'EM ANDAMENTO', 'CONCLUÍDA'];

  function pvLimparFormularioCadastro_() {
    document.getElementById('formPvCadastro').reset();
    document.getElementById('pvListaLinhasLote').innerHTML = '';
    document.getElementById('pv_InstituicaoSelect').style.display = 'none';
    document.getElementById('pv_Instituicao').style.display = '';
    pvAlternarModoCadastro_(PV_MODO_CADASTRO);
  }

  function pvColetarDadosComuns_() {
    return {
      uf: document.getElementById('pv_UF').value,
      municipio: document.getElementById('pv_Municipio').value,
      instituicao: document.getElementById('pv_Instituicao').value,
      cnpjInstituicao: document.getElementById('pv_CNPJInstituicao').value,
      dataDoacao: document.getElementById('pv_DataDoacao').value,
      numeroTermoDoacao: document.getElementById('pv_NumeroTermoDoacao').value
    };
  }

  function pvSubmeterCadastro_(e) {
    e.preventDefault();
    var comuns = pvColetarDadosComuns_();
    if (PV_MODO_CADASTRO === 'individual') {
      var dados = Object.assign({}, comuns, {
        marca: document.getElementById('pv_Marca').value,
        modelo: document.getElementById('pv_Modelo').value,
        placa: document.getElementById('pv_Placa').value,
        chassi: document.getElementById('pv_Chassi').value,
        renavam: document.getElementById('pv_Renavam').value,
        anoFabricacao: document.getElementById('pv_AnoFabricacao').value,
        anoModelo: document.getElementById('pv_AnoModelo').value,
        cnpjProprietario: document.getElementById('pv_CNPJProprietario').value,
        situacaoDetran: document.getElementById('pv_SituacaoDetran').value,
        situacaoTransferencia: document.getElementById('pv_SituacaoTransferencia').value,
        observacoes: document.getElementById('pv_Observacoes').value
      });
      mostrarLoader_('Cadastrando veículo, aguarde...');
      chamarServidor_('cadastrarVeiculoPassivo', dados).then(function () {
        esconderLoader_();
        mostrarMensagem('mensagemPvCadastro', 'sucesso', 'Veículo cadastrado com sucesso.');
        pvLimparFormularioCadastro_();
        pvInvalidarCachePainel_();
      }).catch(function (erro) {
        esconderLoader_();
        mostrarMensagem('mensagemPvCadastro', 'erro', erro.message || String(erro));
      });
    } else {
      var linhas = Array.prototype.slice.call(document.querySelectorAll('#pvListaLinhasLote .pv-linha-lote'));
      if (!linhas.length) {
        mostrarMensagem('mensagemPvCadastro', 'erro', 'Adicione ao menos um veículo.');
        return;
      }
      var veiculos = linhas.map(function (linha) {
        return {
          marca: linha.querySelector('.pv_l_Marca').value,
          modelo: linha.querySelector('.pv_l_Modelo').value,
          placa: linha.querySelector('.pv_l_Placa').value,
          chassi: linha.querySelector('.pv_l_Chassi').value,
          renavam: linha.querySelector('.pv_l_Renavam').value,
          anoFabricacao: linha.querySelector('.pv_l_AnoFabricacao').value,
          anoModelo: linha.querySelector('.pv_l_AnoModelo').value,
          cnpjProprietario: linha.querySelector('.pv_l_CNPJProprietario').value,
          situacaoDetran: linha.querySelector('.pv_l_SituacaoDetran').value,
          situacaoTransferencia: linha.querySelector('.pv_l_SituacaoTransferencia').value
        };
      });
      mostrarLoader_('Cadastrando ' + veiculos.length + ' veículo(s), aguarde...');
      chamarServidor_('cadastrarVeiculosPassivoLote', comuns, veiculos).then(function (resp) {
        esconderLoader_();
        mostrarMensagem('mensagemPvCadastro', 'sucesso', resp.quantidade + ' veículo(s) cadastrado(s) com sucesso.');
        pvLimparFormularioCadastro_();

      }).catch(function (erro) {
        esconderLoader_();
        mostrarMensagem('mensagemPvCadastro', 'erro', erro.message || String(erro));
      });

  function pvInvalidarCachePainel_() {
    if (document.getElementById('tela-pv-inicio').classList.contains('ativa')) carregarPainelPv_();
  }

  // ---------- Listagem ----------
  function carregarListagemPv_() {
    document.getElementById('pvCorpoTabelaListagem').innerHTML = '<tr><td colspan="9" class="carregando">Carregando...</td></tr>';
    var filtro = {
      uf: document.getElementById('pvfUF').value,
      instituicao: document.getElementById('pvfInstituicao').value,
      situacao: document.getElementById('pvfSituacao').value,
      busca: document.getElementById('pvfBusca').value
    };
    chamarServidor_('listarVeiculosPassivo', filtro).then(function (lista) {
      PV_CACHE_LISTAGEM = {};
      lista.forEach(function (v) { PV_CACHE_LISTAGEM[v.ID] = v; });
      document.getElementById('pvContadorVeiculos').textContent = lista.length;
      pvRenderizarTabelaListagem_(lista);
    }).catch(function (erro) {
      document.getElementById('pvCorpoTabelaListagem').innerHTML =
        '<tr><td colspan="9"><div class="mensagem erro">' + escaparHtml(erro.message || String(erro)) + '</div></td></tr>';
    });
  }

  function pvRenderizarTabelaListagem_(lista) {
    var corpo = document.getElementById('pvCorpoTabelaListagem');
    if (!lista.length) {
      corpo.innerHTML = '<tr><td colspan="9">Nenhum veículo encontrado.</td></tr>';
      return;
    }
    corpo.innerHTML = lista.map(function (v) {
      var classeSelo = PV_SELO_SITUACAO[v.SituacaoTransferencia] || 'selo-pendente';
      return '<tr class="linha-clicavel" onclick="pvAbrirEdicao_(\'' + v.ID + '\')">' +
        '<td>' + escaparHtml(v.Placa) + '</td>' +
        '<td>' + escaparHtml(v.Marca) + ' / ' + escaparHtml(v.Modelo) + '</td>' +
        '<td>' + escaparHtml(v.Chassi) + '</td>' +
        '<td>' + escaparHtml(String(v.Renavam)) + '</td>' +
        '<td>' + escaparHtml(v.UF) + '</td>' +
        '<td>' + escaparHtml(v.Municipio) + '</td>' +
        '<td>' + escaparHtml(v.Instituicao) + '</td>' +
        '<td><span class="selo ' + classeSelo + '">' + escaparHtml(v.SituacaoTransferencia) + '</span></td>' +
        '<td><button type="button" class="secundario" onclick="event.stopPropagation(); pvAbrirEdicao_(\'' + v.ID + '\')">Editar</button></td>' +
        '</tr>';
    }).join('');
  }

    document.getElementById('pvfInstituicao').value = '';
    document.getElementById('pvfSituacao').value = '';
    document.getElementById('pvfBusca').value = '';

  // ---------- Débitos (IPVA, Licenciamento, Infrações, Outras) ----------
  function pvPreencherListasInfracoes_() {
    if (!PV_LISTAS_DEBITOS) return;
    document.getElementById('pvifTipo').innerHTML = '<option value="">Todos</option>' + PV_LISTAS_DEBITOS.tipos.map(function (t) {
      return '<option value="' + t + '">' + escaparHtml(PV_LISTAS_DEBITOS.rotulosTipo[t] || t) + '</option>';
    }).join('');
    // Lista de status do filtro combina os dois vocabulários (cancelamento
    // de infração + pagamento dos demais tipos) — PENDENTE existe nos dois
    // e não deve aparecer duplicado.
    var statusFiltro = PV_LISTAS_DEBITOS.statusCancelamento.concat(
      PV_LISTAS_DEBITOS.statusPagamento.filter(function (s) { return PV_LISTAS_DEBITOS.statusCancelamento.indexOf(s) === -1; })
    );
    preencherSelect('pvifStatus', statusFiltro, false, 'Todos');

    document.getElementById('pvi_Tipo').innerHTML = PV_LISTAS_DEBITOS.tipos.map(function (t) {
      return '<option value="' + t + '">' + escaparHtml(PV_LISTAS_DEBITOS.rotulosTipo[t] || t) + '</option>';
    }).join('');
    document.getElementById('pvi_StatusPagamento').innerHTML = '';
    preencherSelect('pvi_StatusPagamento', PV_LISTAS_DEBITOS.statusPagamento, false);
    // pvGarantirListasDebitos_ chama esta função de novo toda vez que o
    // modal de infração abre — sem limpar antes, preencherSelect (que só
    // limpa quando recebe um rótulo de "Selecione.../Todos") ia só
    // empilhando as mesmas opções de novo a cada abertura.
    document.getElementById('pvi_StatusCancelamento').innerHTML = '';
    preencherSelect('pvi_StatusCancelamento', PV_LISTAS_DEBITOS.statusCancelamento, false);

    var todosOrgaos = PV_LISTAS_DEBITOS.orgaosFederais.slice();
    Object.keys(PV_LISTAS_DEBITOS.orgaosPorUF).sort().forEach(function (uf) {
      PV_LISTAS_DEBITOS.orgaosPorUF[uf].forEach(function (o) { todosOrgaos.push(o); });
    });
    preencherSelect('pvifOrgao', todosOrgaos, false, 'Todos');

    var selectModal = document.getElementById('pvi_OrgaoAutuadorSelect');
    var htmlOrgaos = '<option value="">Selecione...</option>';
    if (PV_LISTAS_DEBITOS.orgaosFederais.length) {
      htmlOrgaos += '<optgroup label="Federal">' + PV_LISTAS_DEBITOS.orgaosFederais.map(function (o) {
        return '<option value="' + escaparHtml(o) + '">' + escaparHtml(o) + '</option>';
      }).join('') + '</optgroup>';
    }
    Object.keys(PV_LISTAS_DEBITOS.orgaosPorUF).sort().forEach(function (uf) {
      htmlOrgaos += '<optgroup label="' + escaparHtml(uf) + '">' + PV_LISTAS_DEBITOS.orgaosPorUF[uf].map(function (o) {
        return '<option value="' + escaparHtml(o) + '">' + escaparHtml(o) + '</option>';
      }).join('') + '</optgroup>';
    });
    htmlOrgaos += '<option value="' + PV_ORGAO_MUNICIPAL_VALOR + '">Outro / Município (digitar)</option>';
    selectModal.innerHTML = htmlOrgaos;

    // Datalist em vez de <select>: com 258 artigos, rolar uma lista suspensa
    // é inviável — assim a pessoa digita parte do artigo ou da descrição e
    // o navegador filtra sozinho. PV_MAPA_ARTIGOS usa o texto completo da
    // opção como chave (só ele garante ser único) pra achar de volta o
    // Artigo/Código/Descrição reais na hora de preencher ou salvar.
    // Cada item chega como [Artigo, Descricao, Codigo] (array simples, não
    // objeto) — ver comentário em getListasDebitosPassivo no servidor.
    PV_MAPA_ARTIGOS = {};
    var datalist = document.getElementById('pvi_ArtigoDatalist');
    datalist.innerHTML = PV_LISTAS_DEBITOS.tabelaInfracoes.map(function (item) {
      var artigo = item[0], descricao = item[1], codigo = item[2];
      var rotulo = 'Art. ' + artigo + ' — ' + descricao + (codigo ? ' (Cód. ' + codigo + ')' : '');
      PV_MAPA_ARTIGOS[rotulo] = { Artigo: artigo, Descricao: descricao, Codigo: codigo };
      return '<option value="' + escaparHtml(rotulo) + '"></option>';
    }).join('');
  }

  function pvAplicarArtigoDigitado_() {
    var valor = document.getElementById('pvi_ArtigoBusca').value;
    var item = PV_MAPA_ARTIGOS[valor];
    if (item) {
      document.getElementById('pvi_Codigo').value = item.Codigo || '';
      document.getElementById('pvi_DescricaoInfracao').value = item.Descricao || '';
    }
  }

  function pvLimparArtigoBusca_() {
    var campo = document.getElementById('pvi_ArtigoBusca');
    campo.value = '';
    document.getElementById('pvi_Codigo').value = '';
    document.getElementById('pvi_DescricaoInfracao').value = '';
    campo.focus();
  }

  function pvConfigurarModalInfracao_() {
    document.getElementById('pvi_Placa').addEventListener('blur', pvBuscarVeiculoPorPlacaInfracao_);
    document.getElementById('pvi_Tipo').addEventListener('change', pvAtualizarCamposTipoDebito_);
    document.getElementById('pvi_OrgaoAutuadorSelect').addEventListener('change', function () {
      var outro = this.value === PV_ORGAO_MUNICIPAL_VALOR;
      document.getElementById('pvi_OrgaoAutuador').style.display = outro ? '' : 'none';
      document.getElementById('pvi_OrgaoAutuador').required = outro;
    });
    document.getElementById('pvi_ArtigoBusca').addEventListener('input', pvAplicarArtigoDigitado_);
    document.getElementById('pvi_ArtigoBusca').addEventListener('change', pvAplicarArtigoDigitado_);
    document.getElementById('formPvInfracao').addEventListener('submit', pvSubmeterInfracao_);
  }

  // Mostra/esconde os campos específicos de Infração (AIT, Artigo, Código,
  // Data da infração, Status de cancelamento) x os campos genéricos de
  // débito (Valor, Vencimento, Exercício, Status de pagamento), de acordo
  // com o Tipo selecionado — e ajusta quais ficam obrigatórios.
  function pvAtualizarCamposTipoDebito_() {
    var tipo = document.getElementById('pvi_Tipo').value;
    var ehInfracao = tipo === 'INFRACAO';
    document.getElementById('pvi_GrupoInfracao').style.display = ehInfracao ? '' : 'none';
    document.getElementById('pvi_GrupoGenerico').style.display = ehInfracao ? 'none' : '';
    document.getElementById('pvi_AIT').required = ehInfracao;
    document.getElementById('pvi_StatusCancelamento').required = ehInfracao;
    document.getElementById('pvi_Valor').required = !ehInfracao;
    document.getElementById('pvi_StatusPagamento').required = !ehInfracao;
    document.getElementById('pvi_RotuloOrgao').textContent = ehInfracao ? 'Órgão autuador *' : 'Órgão / Autoridade *';
  }

  // Ao cadastrar um débito, a primeira coisa a fazer é achar o veículo já
  // cadastrado (pela placa) — se não achar, mostra uma advertência clara
  // em vez de só um texto informativo discreto, pra deixar óbvio que algo
  // precisa de atenção antes de continuar.
  function pvBuscarVeiculoPorPlacaInfracao_() {
    var placa = document.getElementById('pvi_Placa').value;
    var info = document.getElementById('pvi_VeiculoInfo');
    if (!placa) { info.innerHTML = ''; return; }
    chamarServidor_('buscarVeiculoPassivoPorPlaca', placa).then(function (v) {
      info.innerHTML = v
        ? escaparHtml(v.Marca + ' ' + v.Modelo + ' — Chassi ' + v.Chassi)
        : '<strong style="color:var(--vermelho);">⚠️ Veículo não cadastrado.</strong> Cadastre-o na tela "Veículos" antes de continuar (ou prossiga se tiver certeza da placa).';
    }).catch(function () { info.innerHTML = ''; });
  }

  // Sempre tenta (re)carregar status/órgãos/artigos ao abrir o modal, em
  // vez de confiar só no carregamento feito na entrada do painel — se por
  // algum motivo aquele primeiro carregamento falhou ou ainda não tinha
  // terminado, isso conserta sozinho. Se falhar de novo, mostra o erro de
  // verdade dentro do próprio modal (em vez de deixar os campos vazios
  // sem explicação nenhuma).
  function pvGarantirListasDebitos_() {
    if (PV_LISTAS_DEBITOS) {
      pvPreencherListasInfracoes_();
      return;
    }
    mostrarMensagem('mensagemPvInfracao', 'sucesso', 'Carregando listas de órgãos e status...');
    chamarServidor_('getListasDebitosPassivo').then(function (listas) {
      PV_LISTAS_DEBITOS = listas;
      pvPreencherListasInfracoes_();
      document.getElementById('mensagemPvInfracao').innerHTML = '';
    }).catch(function (erro) {
      mostrarMensagem('mensagemPvInfracao', 'erro', 'Não consegui carregar as listas de órgãos/status: ' + (erro.message || String(erro)));
    });
  }

  function pvAbrirNovaInfracao_() {
    document.getElementById('formPvInfracao').reset();
    document.getElementById('pvi_ID').value = '';
    document.getElementById('pviModalTitulo').textContent = 'Novo débito';
    document.getElementById('pvi_VeiculoInfo').textContent = '';
    document.getElementById('pvi_OrgaoAutuador').style.display = 'none';
    document.getElementById('pviBotaoExcluir').style.display = 'none';
    document.getElementById('pvi_ListaEnvios').innerHTML = '<p class="dica-painel" style="margin:0;">Salve o débito primeiro pra poder registrar envios.</p>';
    document.getElementById('pvi_BotaoRegistrarEnvioWrap').style.display = 'none';
    document.getElementById('mensagemPvInfracao').innerHTML = '';
    var placaFiltro = document.getElementById('pvifPlaca').value;
    if (placaFiltro) {
      document.getElementById('pvi_Placa').value = placaFiltro;
      pvBuscarVeiculoPorPlacaInfracao_();
    }
    document.getElementById('modalPvInfracaoFundo').classList.add('ativo');
    // pvGarantirListasDebitos_ reconstrói o <select> de Tipo (entre outros)
    // — só define o tipo padrão (o do filtro ativo, se houver) DEPOIS
    // disso, senão a reconstrução apaga a seleção.
    pvGarantirListasDebitos_();
    var tipoFiltro = document.getElementById('pvifTipo').value;
    document.getElementById('pvi_Tipo').value = tipoFiltro || 'INFRACAO';
    pvAtualizarCamposTipoDebito_();
  }

  function pvAbrirEdicaoInfracao_(id) {
    var inf = PV_CACHE_INFRACOES[id];
    if (!inf) return;
    document.getElementById('formPvInfracao').reset();
    document.getElementById('pvi_ID').value = inf.ID;
    document.getElementById('pviModalTitulo').textContent = 'Editar débito';
    document.getElementById('pvi_Placa').value = inf.Placa;
    document.getElementById('pvi_VeiculoInfo').textContent = inf.MarcaVeiculo ? (inf.MarcaVeiculo + ' ' + inf.ModeloVeiculo + ' — Chassi ' + inf.ChassiVeiculo) : '';
    document.getElementById('pvi_AIT').value = inf.AIT || '';
    document.getElementById('pvi_DataInfracao').value = inf.DataInfracao || '';
    document.getElementById('pvi_StatusCancelamento').value = inf.StatusCancelamento || '';
    document.getElementById('pvi_Codigo').value = inf.Codigo || '';
    document.getElementById('pvi_DescricaoInfracao').value = inf.DescricaoInfracao || '';
    document.getElementById('pvi_Valor').value = inf.Valor || '';
    document.getElementById('pvi_DataVencimento').value = inf.DataVencimento || '';
    document.getElementById('pvi_Exercicio').value = inf.Exercicio || '';
    document.getElementById('pvi_StatusPagamento').value = inf.StatusPagamento || '';
    document.getElementById('pvi_Observacoes').value = inf.Observacoes || '';

    var selectOrgao = document.getElementById('pvi_OrgaoAutuadorSelect');
    var achouOrgao = Array.prototype.some.call(selectOrgao.options, function (o) { return o.value === inf.OrgaoAutuador; });
    if (achouOrgao) {
      selectOrgao.value = inf.OrgaoAutuador;
      document.getElementById('pvi_OrgaoAutuador').style.display = 'none';
    } else {
      selectOrgao.value = PV_ORGAO_MUNICIPAL_VALOR;
      document.getElementById('pvi_OrgaoAutuador').style.display = '';
      document.getElementById('pvi_OrgaoAutuador').value = inf.OrgaoAutuador || '';
    }

    // O campo de busca guarda o texto digitado/escolhido, não o Artigo
    // "cru" — ao reabrir pra editar, mostra o valor cru mesmo (ele não vai
    // bater com nenhuma chave de PV_MAPA_ARTIGOS, então no submit volta a
    // ser tratado como texto livre, preservando o que já estava salvo).
    document.getElementById('pvi_ArtigoBusca').value = inf.Artigo || '';

    document.getElementById('pviBotaoExcluir').style.display = USUARIO_E_ADMIN ? '' : 'none';
    document.getElementById('pvi_BotaoRegistrarEnvioWrap').style.display = '';
    document.getElementById('pvi_ObservacaoEnvio').value = '';
    document.getElementById('mensagemPvInfracao').innerHTML = '';
    pvCarregarEnviosNaModal_(inf.ID);
    document.getElementById('modalPvInfracaoFundo').classList.add('ativo');
    // pvGarantirListasDebitos_ reconstrói o <select> de Tipo — só define o
    // valor selecionado DEPOIS disso, senão a reconstrução apaga.
    pvGarantirListasDebitos_();
    document.getElementById('pvi_Tipo').value = inf.Tipo || 'INFRACAO';
    pvAtualizarCamposTipoDebito_();
  }

  function pvCarregarEnviosNaModal_(idInfracao) {
    var container = document.getElementById('pvi_ListaEnvios');
    container.innerHTML = '<div class="carregando">Carregando...</div>';
    chamarServidor_('listarEnviosDaInfracaoPassivo', idInfracao).then(function (envios) {
      if (!envios.length) {
        container.innerHTML = '<p class="dica-painel" style="margin:0;">Nenhum envio registrado ainda.</p>';
        return;
      }
      container.innerHTML = envios.map(function (e) {
        return '<div style="font-size:13px; padding:6px 0; border-bottom:1px solid var(--borda);">' +
          '<strong>' + escaparHtml(e.DataEnvio) + '</strong> — ' + escaparHtml(e.RegistradoPor) +
          (e.Observacoes ? '<div style="color:var(--texto-suave);">' + escaparHtml(e.Observacoes) + '</div>' : '') +
          '</div>';
      }).join('');
    }).catch(function (erro) {
      container.innerHTML = '<div class="mensagem erro">' + escaparHtml(erro.message || String(erro)) + '</div>';
    });
  }

  function pvRegistrarEnvio_() {
    var id = document.getElementById('pvi_ID').value;
    if (!id) return;
    var campoObs = document.getElementById('pvi_ObservacaoEnvio');
    chamarServidor_('registrarEnvioCancelamentoPassivo', id, campoObs.value).then(function () {
      campoObs.value = '';
      pvCarregarEnviosNaModal_(id);
      var statusSelect = document.getElementById('pvi_StatusCancelamento');
      if (statusSelect.value === 'PENDENTE') statusSelect.value = 'ENVIADO';
      mostrarMensagem('mensagemPvInfracao', 'sucesso', 'Envio registrado.');
      pvInvalidarCacheInfracoes_();
    }).catch(function (erro) {
      mostrarMensagem('mensagemPvInfracao', 'erro', erro.message || String(erro));
    });
  }

  function pvSubmeterInfracao_(e) {
    e.preventDefault();
    var id = document.getElementById('pvi_ID').value;
    var tipo = document.getElementById('pvi_Tipo').value;
    var selectOrgao = document.getElementById('pvi_OrgaoAutuadorSelect');
    var orgao = selectOrgao.value === PV_ORGAO_MUNICIPAL_VALOR
      ? document.getElementById('pvi_OrgaoAutuador').value
      : selectOrgao.value;
    var textoArtigo = document.getElementById('pvi_ArtigoBusca').value;
    var itemArtigo = PV_MAPA_ARTIGOS[textoArtigo];
    var artigo = itemArtigo ? itemArtigo.Artigo : textoArtigo;
    var dados = {
      tipo: tipo,
      placa: document.getElementById('pvi_Placa').value,
      orgaoAutuador: orgao,
      ait: document.getElementById('pvi_AIT').value,
      artigo: artigo,
      codigo: document.getElementById('pvi_Codigo').value,
      descricaoInfracao: document.getElementById('pvi_DescricaoInfracao').value,
      dataInfracao: document.getElementById('pvi_DataInfracao').value,
      statusCancelamento: document.getElementById('pvi_StatusCancelamento').value,
      valor: document.getElementById('pvi_Valor').value,
      dataVencimento: document.getElementById('pvi_DataVencimento').value,
      exercicio: document.getElementById('pvi_Exercicio').value,
      statusPagamento: document.getElementById('pvi_StatusPagamento').value,
      observacoes: document.getElementById('pvi_Observacoes').value
    };
    var chamada = id
      ? chamarServidor_('atualizarDebitoPassivo', id, dados)
      : chamarServidor_('cadastrarDebitoPassivo', dados);
    chamada.then(function () {
      document.getElementById('modalPvInfracaoFundo').classList.remove('ativo');
      carregarInfracoesPv_();
      pvInvalidarCachePainel_();
    }).catch(function (erro) {
      mostrarMensagem('mensagemPvInfracao', 'erro', erro.message || String(erro));
    });
  }

  function pvExcluirInfracaoAtual_() {
    var id = document.getElementById('pvi_ID').value;
    confirmar_('Tem certeza que deseja excluir este débito? Essa ação não pode ser desfeita.', function () {
      chamarServidor_('excluirDebitoPassivo', id).then(function () {
        document.getElementById('modalPvInfracaoFundo').classList.remove('ativo');
        carregarInfracoesPv_();
        pvInvalidarCachePainel_();
      }).catch(function (erro) {
        mostrarMensagem('mensagemPvInfracao', 'erro', erro.message || String(erro));
      });
    });
  }

  function pvColetarFiltroInfracoes_() {
    return {
      tipo: document.getElementById('pvifTipo').value,
      placa: document.getElementById('pvifPlaca').value,
      orgaoAutuador: document.getElementById('pvifOrgao').value,
      status: document.getElementById('pvifStatus').value,
      busca: document.getElementById('pvifBusca').value
    };
  }

  function carregarInfracoesPv_() {
    document.getElementById('pviCorpoTabela').innerHTML = '<tr><td colspan="9" class="carregando">Carregando...</td></tr>';
    chamarServidor_('listarDebitosPassivo', pvColetarFiltroInfracoes_()).then(function (lista) {
      PV_CACHE_INFRACOES = {};
      lista.forEach(function (inf) { PV_CACHE_INFRACOES[inf.ID] = inf; });
      document.getElementById('pviContador').textContent = lista.length;
      pvRenderizarTabelaInfracoes_(lista);
      pvAtualizarKpisInfracoes_(lista);
    }).catch(function (erro) {
      document.getElementById('pviCorpoTabela').innerHTML =
        '<tr><td colspan="9"><div class="mensagem erro">' + escaparHtml(erro.message || String(erro)) + '</div></td></tr>';
    });
  }

  function pvAtualizarKpisInfracoes_(lista) {
    var porStatus = {};
    var pendenteRS = 0, pagoRS = 0;
    lista.forEach(function (inf) {
      // Os 5 cards de status de cancelamento só fazem sentido pra Infração
      // — os demais tipos usam StatusPagamento (Pendente/Pago).
      if (inf.Tipo === 'INFRACAO') {
        porStatus[inf.StatusCancelamento] = (porStatus[inf.StatusCancelamento] || 0) + 1;
      }
      var valor = Number(inf.Valor) || 0;
      var resolvido = inf.Tipo === 'INFRACAO'
        ? (inf.StatusCancelamento === 'CANCELADA' || inf.StatusCancelamento === 'NEGADA')
        : (inf.StatusPagamento === 'PAGO');
      if (resolvido) { pagoRS += valor; } else { pendenteRS += valor; }
    });
    document.getElementById('pviKpiPendente').textContent = porStatus['PENDENTE'] || 0;
    document.getElementById('pviKpiEnviado').textContent = porStatus['ENVIADO'] || 0;
    document.getElementById('pviKpiRecebido').textContent = porStatus['RECEBIDO'] || 0;
    document.getElementById('pviKpiCancelada').textContent = porStatus['CANCELADA'] || 0;
    document.getElementById('pviKpiNegada').textContent = porStatus['NEGADA'] || 0;
    document.getElementById('pviKpiValorPendente').textContent = formatarMoeda_(pendenteRS);
    document.getElementById('pviKpiValorPago').textContent = formatarMoeda_(pagoRS);
  }

  function pvRenderizarTabelaInfracoes_(lista) {
    var corpo = document.getElementById('pviCorpoTabela');
    if (!lista.length) {
      corpo.innerHTML = '<tr><td colspan="9">Nenhum débito encontrado.</td></tr>';
      return;
    }
    corpo.innerHTML = lista.map(function (inf) {
      var ehInfracao = inf.Tipo === 'INFRACAO';
      var status = ehInfracao ? inf.StatusCancelamento : inf.StatusPagamento;
      var classeSelo = PV_SELO_STATUS_INFRACAO[status] || 'selo-pendente';
      var envios = inf.QtdEnvios ? (inf.QtdEnvios + 'x — último em ' + inf.DataUltimoEnvio) : 'Nenhum';
      if (inf.SemResposta) envios += ' <span class="selo selo-vermelho">Sem resposta</span>';
      var aitArtigo = ehInfracao ? (escaparHtml(inf.AIT) + (inf.Codigo ? ' / ' + escaparHtml(inf.Codigo) : '')) : '—';
      return '<tr class="linha-clicavel" onclick="pvAbrirEdicaoInfracao_(\'' + inf.ID + '\')">' +
        '<td>' + escaparHtml(PV_LISTAS_DEBITOS.rotulosTipo[inf.Tipo] || inf.Tipo) + '</td>' +
        '<td>' + escaparHtml(inf.Placa) + '</td>' +
        '<td>' + escaparHtml(inf.MarcaVeiculo) + ' ' + escaparHtml(inf.ModeloVeiculo) + '</td>' +
        '<td>' + escaparHtml(inf.OrgaoAutuador) + '</td>' +
        '<td>' + aitArtigo + '</td>' +
        '<td>' + (inf.Valor ? formatarMoeda_(inf.Valor) : '—') + '</td>' +
        '<td><span class="selo ' + classeSelo + '">' + escaparHtml(status) + '</span></td>' +
        '<td>' + envios + '</td>' +
        '<td><button type="button" class="secundario" onclick="event.stopPropagation(); pvAbrirEdicaoInfracao_(\'' + inf.ID + '\')">Ver</button></td>' +
        '</tr>';
    }).join('');
  }

  function pvLimparFiltrosInfracoes_() {
    document.getElementById('pvifTipo').value = '';
    document.getElementById('pvifPlaca').value = '';
    document.getElementById('pvifOrgao').value = '';
    document.getElementById('pvifStatus').value = '';
    document.getElementById('pvifBusca').value = '';
    document.getElementById('pvifSei').value = '';
    carregarInfracoesPv_();
  }

  function pvInvalidarCacheInfracoes_() {
    if (document.getElementById('tela-pv-infracoes').classList.contains('ativa')) carregarInfracoesPv_();
  }

  // Usa a impressão do navegador (Salvar como PDF), sem precisar gerar PDF
  // no servidor. Só funciona com um único órgão selecionado no filtro
  // porque o cabeçalho do documento (usado hoje pra pedidos de
  // cancelamento) é específico por órgão.
  function pvExportarPdfInfracoes_() {
    var orgao = document.getElementById('pvifOrgao').value;
    if (!orgao) {
      mostrarMensagem('mensagemPvInfracoes', 'erro', 'Selecione um único órgão autuador no filtro acima antes de exportar.');
      return;
    }
    var lista = Object.keys(PV_CACHE_INFRACOES).map(function (k) { return PV_CACHE_INFRACOES[k]; })
      .filter(function (inf) { return inf.Tipo === 'INFRACAO' && inf.OrgaoAutuador === orgao; });
    if (!lista.length) {
      mostrarMensagem('mensagemPvInfracoes', 'erro', 'Não há infrações desse órgão na lista atual — clique em Filtrar antes de exportar.');
      return;
    }
    var sei = document.getElementById('pvifSei').value;
    var linhas = lista.map(function (inf, i) {
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escaparHtml(inf.Placa) + '</td>' +
        '<td>' + escaparHtml(String(inf.RenavamVeiculo || '')) + '</td>' +
        '<td>' + escaparHtml(inf.ChassiVeiculo || '') + '</td>' +
        '<td>' + escaparHtml(((inf.MarcaVeiculo || '') + ' ' + (inf.ModeloVeiculo || '')).trim()) + '</td>' +
        '<td>' + escaparHtml(inf.AnoVeiculo || '') + '</td>' +
        '<td>' + escaparHtml(inf.AIT) + '</td>' +
        '<td>' + escaparHtml(inf.Codigo || '') + '</td>' +
        '</tr>';
    }).join('');
    var html =
      '<div class="pv-impressao-cabecalho">MINISTÉRIO DA JUSTIÇA E SEGURANÇA PÚBLICA<br>' +
      'SECRETARIA NACIONAL DE SEGURANÇA PÚBLICA<br>' +
      'DIRETORIA DE GESTÃO DE FUNDO NACIONAL DE SEGURANÇA PÚBLICA<br>' +
      'COORDENAÇÃO DE LOGÍSTICA</div>' +
      '<div class="pv-impressao-endereco">Esplanada dos Ministérios, Bloco T, Edifício Sede. Brasília/DF - CEP: 70.064-900</div>' +
      (sei ? '<div class="pv-impressao-endereco">SEI: ' + escaparHtml(sei) + '</div>' : '') +
      '<div class="pv-impressao-titulo">PLANILHA DE PEDIMENTO DE CANCELAMENTO/PRESCRIÇÃO DE INFRAÇÃO — ' + escaparHtml(orgao) + '</div>' +
      '<table><thead><tr><th>ORD</th><th>PLACA</th><th>RENAVAM</th><th>CHASSI</th><th>MODELO</th><th>ANO</th><th>AIT</th><th>CÓDIGO</th></tr></thead><tbody>' +
      linhas + '</tbody></table>';
    var area = document.getElementById('pvAreaImpressaoInfracoes');
    area.innerHTML = html;
    area.classList.add('ativa');
    window.print();
    setTimeout(function () { area.classList.remove('ativa'); area.innerHTML = ''; }, 500);
  }
</script>
