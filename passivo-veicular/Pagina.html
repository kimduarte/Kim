<!--
  Pagina.html
  Página única do site. Monta o head/body a partir dos outros arquivos, via
  chamadas a include() (ver Codigo.gs) que trocam cada trecho pelo conteúdo
  do arquivo referenciado: estilo genérico + estilo do Passivo no head;
  componentes comuns (loader, modal de confirmação) + markup do Passivo no
  body; utilitários de cliente + JS do Passivo, cada um já dentro do seu
  próprio bloco de script; e por fim um bootstrap pequeno que busca o
  contexto inicial do usuário e só então inicializa o painel.

  ATENÇÃO se for editar este arquivo: o motor de templates do Apps Script
  não respeita comentários HTML — ele escaneia o arquivo inteiro procurando
  os marcadores de scriptlet e executa qualquer ocorrência deles, mesmo
  dentro de um comentário como este. Nunca escreva um exemplo literal desse
  marcador aqui dentro (nem em outro comentário de qualquer arquivo .html
  deste projeto) — descreva em prosa, como acima.
-->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('EstiloGenerico'); ?>
  <?!= include('EstiloPassivo'); ?>
</head>
<body>
  <?!= include('ComponentesComuns'); ?>
  <?!= include('PainelPassivoVeicular'); ?>
  <?!= include('UtilitariosCliente'); ?>
  <?!= include('PassivoVeicularJs'); ?>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      configurarModalConfirmacao_();
      chamarServidor_('getContextoInicial').then(function (ctx) {
        CONTEXTO = ctx;
        ORGAOS_POR_UF = ctx.orgaosPorUF || {};
        if (ctx.usuario.perfil === 'sem_acesso') {
          document.getElementById('pvBloqueioEmail').textContent = ctx.usuario.email || '(e-mail não identificado)';
          document.getElementById('pvBloqueioAcesso').style.display = 'flex';
          return;
        }
        var ehAdmin = ctx.usuario.perfil === 'admin';
        USUARIO_E_ADMIN = ehAdmin;
        USUARIO_PODE_EDITAR = ehAdmin || ctx.usuario.perfil === 'usuario';
        pvInicializar_();
      }).catch(mostrarErroGlobalPv_);
    });
  </script>
</body>
</html>
