<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Registrar no celular</title><link rel="stylesheet" href="../inter.css"><link rel="stylesheet" href="../base.css"></head><body><div style="width: 390px; height: 844px; box-sizing: border-box; background: #f2f2f7; font-family: 'Inter', system-ui, sans-serif; color: #1d1d1f; display: flex; flex-direction: column">
  <main style="flex-grow: 1; padding: 20px 16px 16px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: flex-end; height: 32px; align-items: center">
      <a href="#" style="font-size: 17px; text-decoration: none; color: #0071e3">Hoje</a>
    </div>
    <h1 style="margin: 2px 4px 2px; font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15">Registrar</h1>
    <p style="margin: 0 4px 18px; font-size: 15px; color: #6e6e73">Quinta-feira, 24 de setembro</p>

    <div style="background: #ffffff; border-radius: 12px; overflow: hidden">
      <a href="#" style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px 0 16px; color: #1d1d1f; text-decoration: none; font-size: 17px">
        <span style="flex-grow: 1">Servidor</span><span style="color: #6e6e73">Carla Menezes</span>
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5"></path></svg>
      </a>
      <div style="margin-left: 16px; border-top: 1px solid #e5e5ea"></div>
      <div style="display: flex; align-items: center; min-height: 46px; padding: 0 14px 0 16px; font-size: 17px">
        <span style="flex-grow: 1">Data</span>
        <button type="button" style="height: 32px; padding: 0 11px; border: 0; border-radius: 7px; background: #eeeef0; font-family: inherit; font-size: 17px; color: #1d1d1f; cursor: pointer">24 de set. de 2026</button>
      </div>
    </div>

    <h2 style="margin: 22px 16px 7px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: #6e6e73">UF atendida</h2>
    <div style="background: #ffffff; border-radius: 12px; padding: 8px">
      <div role="group" aria-label="UF atendida" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 2px; background: #eeeef0; border-radius: 9px">
        <button type="button" aria-pressed="false" style="height: 32px; border: 0; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #1d1d1f; cursor: pointer">AL</button>
        <button type="button" aria-pressed="true" style="height: 32px; border: 0; border-radius: 7px; background: #ffffff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04); font-family: inherit; font-size: 14px; font-weight: 600; color: #1d1d1f; cursor: pointer">BA</button>
        <button type="button" aria-pressed="false" style="height: 32px; border: 0; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #1d1d1f; cursor: pointer">PE</button>
        <button type="button" aria-pressed="false" style="height: 32px; border: 0; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #1d1d1f; cursor: pointer">SE</button>
        <button type="button" aria-pressed="false" style="height: 32px; border: 0; border-radius: 7px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 500; color: #1d1d1f; cursor: pointer">Outra</button>
      </div>
    </div>

    <h2 style="margin: 22px 16px 7px; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.02em; color: #6e6e73">Atividade</h2>
    <div style="background: #ffffff; border-radius: 12px; overflow: hidden">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 0 14px 0 16px; color: #1d1d1f; text-decoration: none">
        <span style="width: 30px; height: 30px; border-radius: 7px; background: #ff2d55; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16.5h14v-3.2l-1.6-4A2 2 0 0 0 15.5 8h-7a2 2 0 0 0-1.9 1.3L5 13.3z"></path><path d="M5 13.3h14"></path></svg>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; line-height: 1.25">
          <span style="font-size: 17px">Veículo transferido</span>
          <span style="font-size: 13px; color: #6e6e73">Veículos regularizados</span>
        </span>
        <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5"></path></svg>
      </a>
      <div style="margin-left: 58px; border-top: 1px solid #e5e5ea"></div>
      <div style="display: flex; align-items: center; min-height: 46px; padding: 0 12px 0 16px; font-size: 17px">
        <span style="flex-grow: 1">Quantidade</span>
        <span style="margin-right: 12px; color: #6e6e73; font-variant-numeric: tabular-nums">1</span>
        <div style="display: flex; align-items: center; height: 32px; background: #eeeef0; border-radius: 8px">
          <button type="button" aria-label="Diminuir quantidade" style="width: 46px; height: 32px; border: 0; background: transparent; font-family: inherit; font-size: 20px; color: #1d1d1f; cursor: pointer">−</button>
          <i style="width: 1px; height: 18px; background: #c7c7cc"></i>
          <button type="button" aria-label="Aumentar quantidade" style="width: 46px; height: 32px; border: 0; background: transparent; font-family: inherit; font-size: 20px; color: #1d1d1f; cursor: pointer">+</button>
        </div>
      </div>
      <div style="margin-left: 16px; border-top: 1px solid #e5e5ea"></div>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 16px; font-size: 17px">
        <span>Referência</span>
        <input type="text" value="RBX4C21" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; text-align: right; font-family: inherit; font-size: 17px; color: #6e6e73">
      </label>
    </div>
    <p style="margin: 7px 16px 0; font-size: 13px; color: #6e6e73; line-height: 1.4">Placa, número SEI ou ofício. Opcional.</p>

    <span style="flex-grow: 1"></span>
    <button type="button" style="height: 50px; border: 0; border-radius: 12px; background: #0071e3; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Registrar</button>
    <p style="margin: 10px 0 0; text-align: center; font-size: 13px; color: #6e6e73">Hoje você já registrou 3 atividades.</p>
  </main>

  <nav class="abas-cel"><span><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Visão geral</span><span class="ativo"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Registrar</span><span><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.7-3 2.9-4.8 5.5-4.8s4.8 1.8 5.5 4.8"/><circle cx="16.8" cy="9.5" r="2.4"/><path d="M16.8 14.3c2 0 3.5 1.3 4 3.6"/></svg>Equipe</span><span><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.9 6 6 0 0 0-11.6-1A4.5 4.5 0 0 0 7 18.5z"/><path d="M12 11v5M9.8 13.2 12 11l2.2 2.2"/></svg>Dados</span></nav>
</div></body></html>
